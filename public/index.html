<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LEXINX Protect</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070707;
    color:#eee;
    font-family:Arial,sans-serif;
}

.wrap{
    width:min(1100px,94%);
    margin:30px auto;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:20px;
    margin-bottom:15px;
}

h1,h2{
    margin-top:0;
}

input,
textarea{
    width:100%;
    background:#050505;
    color:#eee;
    border:1px solid #333;
    border-radius:8px;
    padding:12px;
    outline:none;
}

input{
    margin-bottom:10px;
}

textarea{
    min-height:300px;
    resize:vertical;
    font:13px/1.5 Consolas,monospace;
}

input:focus,
textarea:focus{
    border-color:#777;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
    background:#eee;
    color:#111;
}

button.secondary{
    background:#222;
    color:#eee;
    border:1px solid #333;
}

button.danger{
    background:#401717;
    color:#ff9999;
}

button:hover{
    opacity:.82;
}

.hidden{
    display:none!important;
}

.status{
    margin-top:12px;
    padding:12px;
    background:#0c0c0c;
    border:1px solid #292929;
    border-radius:8px;
    white-space:pre-wrap;
    color:#aaa;
}

.status.ok{
    color:#8cff9b;
}

.status.error{
    color:#ff7777;
}

.row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.account-url{
    color:#888;
    word-break:break-all;
    margin-top:6px;
}

.script{
    background:#0b0b0b;
    border:1px solid #292929;
    border-radius:10px;
    padding:15px;
    margin-top:10px;
}

.script-name{
    font-weight:bold;
    margin-bottom:7px;
}

.script-id{
    color:#777;
    font:12px Consolas,monospace;
    word-break:break-all;
}

.loader{
    margin-top:10px;
    padding:10px;
    border:1px solid #292929;
    border-radius:7px;
    background:#050505;
    color:#aaa;
    font:12px Consolas,monospace;
    word-break:break-all;
}

.small{
    color:#777;
    font-size:12px;
}

@media(max-width:700px){
    .wrap{
        width:96%;
        margin:15px auto;
    }
}
</style>
</head>

<body>

<div class="wrap">

<!-- =====================================================
     AUTH
===================================================== -->

<div id="auth">

    <div class="card">

        <h1>LEXINX Protect</h1>

        <p class="small">
            Create an account or sign in to continue.
        </p>

        <input
            id="username"
            autocomplete="username"
            placeholder="Username"
        >

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
        >

        <div class="row">

            <button onclick="register()">
                CREATE ACCOUNT
            </button>

            <button
                class="secondary"
                onclick="login()"
            >
                LOGIN
            </button>

        </div>

        <div
            id="authStatus"
            class="status"
        >
            Ready.
        </div>

    </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div
    id="dashboard"
    class="hidden"
>

    <div class="card">

        <div class="row">

            <div style="flex:1">

                <h1>
                    LEXINX Dashboard
                </h1>

                <div>
                    Signed in as:
                    <b id="accountName">-</b>
                </div>

                <div
                    id="accountURL"
                    class="account-url"
                >
                    -
                </div>

            </div>

            <button
                class="secondary"
                onclick="logout()"
            >
                LOGOUT
            </button>

        </div>

    </div>


    <!-- CREATE SCRIPT -->

    <div class="card">

        <h2>
            Create Script
        </h2>

        <input
            id="scriptName"
            placeholder="Script name"
        >

        <textarea
            id="scriptSource"
            spellcheck="false"
            placeholder="Paste your Lua / Luau source here..."
        ></textarea>

        <button onclick="createScript()">
            CREATE SCRIPT
        </button>

        <div
            id="createStatus"
            class="status"
        >
            Ready.
        </div>

    </div>


    <!-- EDITOR -->

    <div
        id="editor"
        class="card hidden"
    >

        <h2>
            Edit Script
        </h2>

        <input
            id="editName"
            placeholder="Script name"
        >

        <textarea
            id="editSource"
            spellcheck="false"
            placeholder="Script source..."
        ></textarea>

        <div class="row">

            <button onclick="saveEdit()">
                SAVE CHANGES
            </button>

            <button
                class="secondary"
                onclick="cancelEdit()"
            >
                CANCEL
            </button>

        </div>

        <div
            id="editStatus"
            class="status"
        >
            Ready.
        </div>

    </div>


    <!-- SCRIPTS -->

    <div class="card">

        <div class="row">

            <h2 style="flex:1">
                My Scripts
            </h2>

            <button
                class="secondary"
                onclick="loadScripts()"
            >
                REFRESH
            </button>

        </div>

        <div id="scripts">
            Loading...
        </div>

    </div>

</div>

</div>


<script>

/* =====================================================
   API
===================================================== */

async function api(
    url,
    options = {}
){

    const response =
        await fetch(
            url,
            {
                credentials:"same-origin",
                ...options,
                headers:{
                    "Content-Type":
                        "application/json",
                    ...(options.headers || {})
                }
            }
        );

    const text =
        await response.text();

    let data = {};

    try{
        data =
            text
            ? JSON.parse(text)
            : {};
    }catch{
        throw new Error(
            `Server returned HTTP ${response.status}`
        );
    }

    if(!response.ok){

        throw new Error(
            data.error ||
            `HTTP ${response.status}`
        );
    }

    return data;
}


/* =====================================================
   STATUS
===================================================== */

function status(
    element,
    message,
    ok = false
){

    element.className =
        "status " +
        (ok ? "ok" : "error");

    element.textContent =
        message;
}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(data){

    document
        .getElementById("auth")
        .classList
        .add("hidden");

    document
        .getElementById("dashboard")
        .classList
        .remove("hidden");

    document
        .getElementById("accountName")
        .textContent =
        data.username || "-";

    document
        .getElementById("accountURL")
        .textContent =
        data.url || "-";

    loadScripts();
}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showAuth(){

    document
        .getElementById("dashboard")
        .classList
        .add("hidden");

    document
        .getElementById("auth")
        .classList
        .remove("hidden");
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const box =
        document
        .getElementById("authStatus");

    if(!username){

        status(
            box,
            "Please enter a username."
        );

        return;
    }

    if(password.length < 6){

        status(
            box,
            "Password must contain at least 6 characters."
        );

        return;
    }

    box.className =
        "status";

    box.textContent =
        "Creating account...";

    try{

        const data =
            await api(
                "/api/register",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        showDashboard(data);

    }catch(error){

        status(
            box,
            "Registration failed:\n" +
            error.message
        );
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const box =
        document
        .getElementById("authStatus");

    if(!username || !password){

        status(
            box,
            "Please enter your username and password."
        );

        return;
    }

    box.className =
        "status";

    box.textContent =
        "Signing in...";

    try{

        const data =
            await api(
                "/api/login",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        showDashboard(data);

    }catch(error){

        status(
            box,
            "Login failed:\n" +
            error.message
        );
    }
}


/* =====================================================
   SESSION RESTORE
===================================================== */

async function restoreSession(){

    try{

        const data =
            await api("/api/me");

        if(data.ok){

            showDashboard(data);

            return;
        }

    }catch{}

    showAuth();
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        await api(
            "/api/logout",
            {
                method:"POST"
            }
        );

    }catch{}

    document
        .getElementById("authStatus")
        .className =
        "status";

    document
        .getElementById("authStatus")
        .textContent =
        "You have been logged out.";

    showAuth();
}


/* =====================================================
   CREATE
===================================================== */

async function createScript(){

    const name =
        document
        .getElementById("scriptName")
        .value
        .trim();

    const source =
        document
        .getElementById("scriptSource")
        .value;

    const box =
        document
        .getElementById("createStatus");

    if(!source.trim()){

        status(
            box,
            "Script source cannot be empty."
        );

        return;
    }

    box.className =
        "status";

    box.textContent =
        "Creating script...";

    try{

        const data =
            await api(
                "/api/create",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            name:
                                name ||
                                "Untitled Script",

                            source
                        })
                }
            );

        status(
            box,
            "Script created successfully.\n\n" +
            "ID: " +
            data.id +
            "\n\nLoader:\n" +
            data.loader,
            true
        );

        document
            .getElementById("scriptName")
            .value = "";

        document
            .getElementById("scriptSource")
            .value = "";

        loadScripts();

    }catch(error){

        status(
            box,
            "Create failed:\n" +
            error.message
        );
    }
}


/* =====================================================
   LOAD SCRIPTS
===================================================== */

async function loadScripts(){

    const container =
        document
        .getElementById("scripts");

    container.textContent =
        "Loading...";

    try{

        const data =
            await api(
                "/api/scripts"
            );

        container.innerHTML = "";

        if(
            !data.scripts ||
            data.scripts.length === 0
        ){

            container.innerHTML =
                '<div class="small">' +
                'You have no scripts yet.' +
                '</div>';

            return;
        }

        for(
            const script
            of data.scripts
        ){

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "script";

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "script-name";

            title.textContent =
                script.name;

            const id =
                document.createElement(
                    "div"
                );

            id.className =
                "script-id";

            id.textContent =
                "ID: " +
                script.id;

            const loader =
                document.createElement(
                    "div"
                );

            loader.className =
                "loader";

            loader.textContent =
                script.loader;

            const buttons =
                document.createElement(
                    "div"
                );

            buttons.className =
                "row";

            const copy =
                document.createElement(
                    "button"
                );

            copy.textContent =
                "COPY LOADER";

            copy.onclick =
                () =>
                    copyText(
                        script.loader
                    );

            const edit =
                document.createElement(
                    "button"
                );

            edit.className =
                "secondary";

            edit.textContent =
                "EDIT";

            edit.onclick =
                () =>
                    openEditor(
                        script.id
                    );

            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "danger";

            del.textContent =
                "DELETE";

            del.onclick =
                () =>
                    deleteScript(
                        script.id
                    );

            buttons.appendChild(copy);
            buttons.appendChild(edit);
            buttons.appendChild(del);

            box.appendChild(title);
            box.appendChild(id);
            box.appendChild(loader);
            box.appendChild(buttons);

            container.appendChild(box);
        }

    }catch(error){

        container.textContent =
            "Failed to load scripts: " +
            error.message;
    }
}


/* =====================================================
   OPEN EDITOR
===================================================== */

let editingID = null;

async function openEditor(id){

    try{

        const data =
            await api(
                "/api/script/" +
                encodeURIComponent(id)
            );

        editingID =
            id;

        document
            .getElementById("editName")
            .value =
            data.script.name;

        document
            .getElementById("editSource")
            .value =
            data.script.source;

        document
            .getElementById("editor")
            .classList
            .remove("hidden");

        document
            .getElementById("editor")
            .scrollIntoView({
                behavior:"smooth"
            });

    }catch(error){

        alert(
            "Failed to open script:\n" +
            error.message
        );
    }
}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

    if(!editingID)
        return;

    const name =
        document
        .getElementById("editName")
        .value
        .trim();

    const source =
        document
        .getElementById("editSource")
        .value;

    const box =
        document
        .getElementById("editStatus");

    try{

        await api(
            "/api/script/" +
            encodeURIComponent(
                editingID
            ),
            {
                method:"PUT",

                body:
                    JSON.stringify({
                        name,
                        source
                    })
            }
        );

        status(
            box,
            "Changes saved successfully.",
            true
        );

        loadScripts();

    }catch(error){

        status(
            box,
            "Save failed:\n" +
            error.message
        );
    }
}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

    editingID = null;

    document
        .getElementById("editor")
        .classList
        .add("hidden");
}


/* =====================================================
   DELETE
===================================================== */

async function deleteScript(id){

    if(
        !confirm(
            "Delete this script permanently?"
        )
    ){
        return;
    }

    try{

        await api(
            "/api/script/" +
            encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );

        if(
            editingID === id
        ){
            cancelEdit();
        }

        loadScripts();

    }catch(error){

        alert(
            "Delete failed:\n" +
            error.message
        );
    }
}


/* =====================================================
   COPY
===================================================== */

async function copyText(text){

    try{

        await navigator.clipboard
            .writeText(text);

        alert(
            "Loader copied to clipboard."
        );

    }catch{

        const area =
            document.createElement(
                "textarea"
            );

        area.value =
            text;

        document.body.appendChild(
            area
        );

        area.select();

        document.execCommand(
            "copy"
        );

        area.remove();

        alert(
            "Loader copied to clipboard."
        );
    }
}


/* =====================================================
   START
===================================================== */

restoreSession();

</script>

</body>
</html>
