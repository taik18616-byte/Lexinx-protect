<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEXINX PROTECT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(1000px, 94%);
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .sub {
            color: #888;
            margin-bottom: 25px;
        }

        .card {
            background: #111;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            background: #080808;
            border: 1px solid #303030;
            color: white;
            border-radius: 8px;
            padding: 12px;
            outline: none;
        }

        input {
            margin-bottom: 12px;
        }

        textarea {
            min-height: 300px;
            resize: vertical;
            font-family: monospace;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            margin-top: 12px;
            cursor: pointer;
            background: white;
            color: black;
            font-weight: bold;
        }

        button:hover {
            opacity: .85;
        }

        .script {
            border: 1px solid #282828;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .script-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .id {
            color: #777;
            font-size: 12px;
            word-break: break-all;
        }

        .loader {
            margin-top: 10px;
            background: #050505;
            border: 1px solid #222;
            padding: 10px;
            border-radius: 7px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
        }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .message {
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>LEXINX PROTECT</h1>

    <div class="sub">
        Lua Script Loader Manager
    </div>

    <div class="card">

        <h2>Create / Edit Script</h2>

        <input
            id="name"
            placeholder="Script name"
        >

        <textarea
            id="source"
            placeholder="Paste Lua source here..."
        ></textarea>

        <input
            id="editId"
            placeholder="Leave empty to create new script"
        >

        <button onclick="saveScript()">
            CREATE SCRIPT
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </div>

    <div class="card">

        <h2>Scripts</h2>

        <button onclick="loadScripts()">
            REFRESH
        </button>

        <div id="scripts"></div>

    </div>

</div>

<script>

async function saveScript() {

    const name =
        document.getElementById("name").value;

    const source =
        document.getElementById("source").value;

    const editId =
        document.getElementById("editId").value.trim();

    if (!source.trim()) {
        showMessage(
            "Please enter Lua source."
        );
        return;
    }

    let url = "/api/create";
    let method = "POST";

    if (editId) {
        url =
            "/api/edit/" +
            encodeURIComponent(editId);

        method = "POST";
    }

    try {

        const response =
            await fetch(url, {
                method,
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    name,
                    source
                })
            });

        const data =
            await response.json();

        if (!response.ok || !data.ok) {
            showMessage(
                data.error ||
                "Request failed."
            );
            return;
        }

        showMessage(
            editId
                ? "Script updated."
                : "Script created."
        );

        document.getElementById(
            "editId"
        ).value = data.id;

        await loadScripts();

    } catch (error) {

        showMessage(
            "Error: " + error.message
        );
    }
}

async function loadScripts() {

    const container =
        document.getElementById("scripts");

    container.innerHTML =
        "Loading...";

    try {

        const response =
            await fetch("/api/scripts");

        const data =
            await response.json();

        if (!data.ok) {
            container.innerHTML =
                "Failed to load scripts.";
            return;
        }

        if (!data.scripts.length) {
            container.innerHTML =
                "No scripts yet.";
            return;
        }

        container.innerHTML = "";

        data.scripts.forEach(script => {

            const div =
                document.createElement("div");

            div.className = "script";

            div.innerHTML = `

                <div class="script-name">
                    ${escapeHtml(script.name)}
                </div>

                <div class="id">
                    ID: ${escapeHtml(script.id)}
                </div>

                <div class="loader">
                    ${escapeHtml(script.loader)}
                </div>

                <div class="buttons">

                    <button
                        onclick='copyText(${JSON.stringify(script.loader)})'
                    >
                        COPY LOADER
                    </button>

                    <button
                        onclick='editScript(${JSON.stringify(script.id)}, ${JSON.stringify(script.name)})'
                    >
                        EDIT
                    </button>

                    <button
                        onclick='deleteScript(${JSON.stringify(script.id)})'
                    >
                        DELETE
                    </button>

                </div>
            `;

            container.appendChild(div);
        });

    } catch (error) {

        container.innerHTML =
            "Error: " +
            escapeHtml(error.message);
    }
}

function editScript(id, name) {

    document.getElementById(
        "editId"
    ).value = id;

    document.getElementById(
        "name"
    ).value = name;

    showMessage(
        "Enter the new source and save."
    );
}

async function deleteScript(id) {

    if (!confirm(
        "Delete this script?"
    )) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/delete/" +
                encodeURIComponent(id),
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (!data.ok) {
            alert(
                data.error ||
                "Delete failed."
            );
            return;
        }

        await loadScripts();

    } catch (error) {

        alert(error.message);
    }
}

async function copyText(text) {

    try {

        await navigator.clipboard.writeText(
            text
        );

        showMessage(
            "Loader copied."
        );

    } catch {

        alert(text);
    }
}

function showMessage(text) {

    document.getElementById(
        "message"
    ).textContent = text;
}

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadScripts();

</script>

</body>
</html>
