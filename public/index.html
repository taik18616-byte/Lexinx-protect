<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>LEXINX PROTECT</title>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    background:#070707;
    color:#eee;
    font-family:Arial,sans-serif
}

.wrap{
    width:min(1000px,94%);
    margin:30px auto
}

h1{
    margin:0 0 5px
}

.sub{
    color:#777;
    margin-bottom:20px
}

.panel{
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px
}

label{
    display:block;
    color:#aaa;
    margin-bottom:7px
}

input,
textarea{
    width:100%;
    background:#050505;
    color:#eee;
    border:1px solid #333;
    border-radius:8px;
    padding:12px;
    outline:none;
    font-family:Consolas,monospace
}

input{
    margin-bottom:15px
}

textarea{
    min-height:300px;
    resize:vertical
}

button{
    border:0;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:bold;
    margin-right:7px;
    margin-top:10px
}

.primary{
    background:#eee;
    color:#111
}

.secondary{
    background:#222;
    color:#eee;
    border:1px solid #333
}

.status{
    margin-top:15px;
    padding:12px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:8px;
    white-space:pre-wrap
}

.ok{
    color:#8cff9b
}

.err{
    color:#ff7777
}

.loader{
    margin-top:15px
}
</style>
</head>

<body>

<div class="wrap">

<h1>LEXINX PROTECT</h1>

<div class="sub">
Server-side script delivery
</div>

<div class="panel">

<label>Script name</label>

<input
    id="name"
    placeholder="My Script"
>

<label>Lua / Luau source</label>

<textarea
    id="source"
    placeholder="Paste Lua source here..."
></textarea>

<button
    class="primary"
    onclick="createScript()">
    CREATE
</button>

<button
    class="secondary"
    onclick="clearAll()">
    CLEAR
</button>

<div
    id="status"
    class="status">
Ready.
</div>

<div
    id="loaderBox"
    class="loader"
    style="display:none">

<label>Generated loader</label>

<textarea
    id="loader"
    readonly
    style="min-height:100px">
</textarea>

<button
    class="secondary"
    onclick="copyLoader()">
    COPY LOADER
</button>

</div>

</div>

<div class="panel">

<h3>Scripts</h3>

<div id="scripts">
Loading...
</div>

</div>

</div>

<script>

async function createScript(){

    const name =
        document.getElementById(
            "name"
        ).value;

    const source =
        document.getElementById(
            "source"
        ).value;

    const status =
        document.getElementById(
            "status"
        );

    if(!source.trim()){

        status.className =
            "status err";

        status.textContent =
            "Script is empty.";

        return;
    }

    status.className =
        "status";

    status.textContent =
        "Creating...";

    try{

        const response =
            await fetch(
                "/api/create",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        name,
                        source
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.ok){
            throw new Error(
                data.error ||
                "Create failed"
            );
        }

        document.getElementById(
            "loader"
        ).value =
            data.loader;

        document.getElementById(
            "loaderBox"
        ).style.display =
            "block";

        status.className =
            "status ok";

        status.textContent =
            "Created successfully.\n\n"+
            "ID: "+
            data.id;

        loadScripts();

    }catch(error){

        status.className =
            "status err";

        status.textContent =
            error.message;
    }
}

async function loadScripts(){

    const box =
        document.getElementById(
            "scripts"
        );

    try{

        const response =
            await fetch(
                "/api/scripts"
            );

        const data =
            await response.json();

        if(!data.ok){
            throw new Error(
                "Failed"
            );
        }

        if(!data.scripts.length){

            box.innerHTML =
                "<span style='color:#777'>No scripts.</span>";

            return;
        }

        box.innerHTML =
            data.scripts.map(
                script => `
<div style="
    padding:12px;
    border:1px solid #292929;
    border-radius:8px;
    margin-bottom:8px;
">
    <b>${escapeHTML(script.name)}</b>

    <div style="
        color:#777;
        font-size:12px;
        margin-top:5px;
    ">
        ID: ${escapeHTML(script.id)}
    </div>

    <button
        class="secondary"
        onclick="copyText('${escapeJS(script.loader)}')">
        COPY LOADER
    </button>
</div>
`
            ).join("");

    }catch(error){

        box.textContent =
            "Failed to load scripts.";
    }
}

async function copyLoader(){

    const loader =
        document.getElementById(
            "loader"
        ).value;

    await copyText(loader);
}

async function copyText(text){

    try{

        await navigator.clipboard.writeText(
            text
        );

    }catch{

        const area =
            document.createElement(
                "textarea"
            );

        area.value = text;

        document.body.appendChild(
            area
        );

        area.select();

        document.execCommand(
            "copy"
        );

        area.remove();
    }
}

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escapeJS(text){

    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");
}

function clearAll(){

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "source"
    ).value = "";

    document.getElementById(
        "loader"
    ).value = "";

    document.getElementById(
        "loaderBox"
    ).style.display =
        "none";

    document.getElementById(
        "status"
    ).className =
        "status";

    document.getElementById(
        "status"
    ).textContent =
        "Ready.";
}

loadScripts();

</script>

</body>
</html>
