<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>LEXINX PROTECT</title>

<style>
body {
    margin: 0;
    background: #070707;
    color: #eee;
    font-family: Arial;
}

.container {
    width: min(900px, 94%);
    margin: 40px auto;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

input,
textarea {
    width: 100%;
    box-sizing: border-box;
    background: #050505;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 11px;
    margin-bottom: 10px;
}

textarea {
    min-height: 300px;
    resize: vertical;
    font-family: monospace;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: bold;
}

.script {
    background: #080808;
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
}

.loader {
    width: 100%;
    margin-top: 10px;
}

.status {
    margin-top: 10px;
    color: #888;
    font-family: monospace;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>LEXINX PROTECT</h1>

<input
    id="admin"
    type="password"
    placeholder="Admin token">

<input
    id="name"
    placeholder="Script name">

<input
    id="file"
    type="file"
    accept=".lua,.txt">

<textarea
    id="code"
    placeholder="Paste Lua source here...">
</textarea>

<button onclick="createScript()">
Create Script
</button>

<div id="status"
     class="status">
</div>

</div>

<div class="card">

<h2>Scripts</h2>

<div id="list">
Loading...
</div>

</div>

</div>

<script>

async function api(
    url,
    options = {}
) {

    options.headers =
        options.headers || {};

    options.headers[
        "X-Admin-Token"
    ] =
        document.getElementById(
            "admin"
        ).value;

    return fetch(
        url,
        options
    );
}

async function createScript() {

    const status =
        document.getElementById(
            "status"
        );

    let code =
        document.getElementById(
            "code"
        ).value;

    const file =
        document.getElementById(
            "file"
        ).files[0];

    if (file) {
        code =
            await file.text();
    }

    if (!code.trim()) {
        status.textContent =
            "Script is empty";
        return;
    }

    const name =
        document.getElementById(
            "name"
        ).value ||
        file?.name ||
        "Script";

    status.textContent =
        "Creating...";

    const response =
        await api(
            "/api/create",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        name,
                        code
                    })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {
        status.textContent =
            data.error ||
            "Error";
        return;
    }

    status.textContent =
        "Created: " +
        data.id;

    document.getElementById(
        "code"
    ).value = "";

    document.getElementById(
        "file"
    ).value = "";

    loadScripts();
}

async function loadScripts() {

    const response =
        await api(
            "/api/scripts"
        );

    const data =
        await response.json();

    const list =
        document.getElementById(
            "list"
        );

    list.innerHTML = "";

    if (
        !data.ok ||
        data.scripts.length === 0
    ) {
        list.textContent =
            "No scripts.";
        return;
    }

    for (
        const script
        of data.scripts
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "script";

        const title =
            document.createElement(
                "b"
            );

        title.textContent =
            script.name;

        const id =
            document.createElement(
                "div"
            );

        id.textContent =
            "ID: " +
            script.id;

        const loader =
            document.createElement(
                "input"
            );

        loader.className =
            "loader";

        loader.readOnly = true;

        /*
         * Đây là URL của endpoint
         * tạo session.
         *
         * Không phải payload trực tiếp.
         */

        loader.value =
            `${location.origin}/api/session?id=${script.id}`;

        const copy =
            document.createElement(
                "button"
            );

        copy.textContent =
            "Copy URL";

        copy.onclick = () => {

            navigator.clipboard
                .writeText(
                    loader.value
                );

            copy.textContent =
                "Copied!";

            setTimeout(
                () => {
                    copy.textContent =
                        "Copy URL";
                },
                1000
            );
        };

        const del =
            document.createElement(
                "button"
            );

        del.textContent =
            "Delete";

        del.onclick =
            async () => {

                if (
                    !confirm(
                        "Delete this script?"
                    )
                ) {
                    return;
                }

                await api(
                    `/api/scripts/${script.id}`,
                    {
                        method:
                            "DELETE"
                    }
                );

                loadScripts();
            };

        box.appendChild(title);
        box.appendChild(id);
        box.appendChild(loader);
        box.appendChild(copy);
        box.appendChild(del);

        list.appendChild(box);
    }
}

loadScripts();

</script>

</body>
</html>
