<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>LEXINX Protect</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #070707;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================
   AUTH
========================= */

.auth {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 410px;

    padding: 30px;

    background: #111;
    border: 1px solid #292929;

    border-radius: 18px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);
}

.logo {
    text-align: center;

    font-size: 32px;
    font-weight: 900;

    letter-spacing: 2px;

    margin-bottom: 5px;
}

.subtitle {
    text-align: center;

    color: #777;

    margin-bottom: 28px;
}

input,
textarea {
    width: 100%;

    color: #fff;
    background: #080808;

    border: 1px solid #2c2c2c;

    border-radius: 10px;

    outline: none;

    padding: 12px;

    margin-bottom: 12px;
}

input:focus,
textarea:focus {
    border-color: #666;
}

.auth button {
    width: 100%;

    padding: 12px;

    border: 0;
    border-radius: 10px;

    background: #fff;
    color: #000;

    font-weight: 700;
}

.message {
    min-height: 20px;

    margin-top: 12px;

    text-align: center;

    font-size: 14px;
}

.error {
    color: #ff6262;
}

.success {
    color: #63e99b;
}

.switch {
    text-align: center;

    margin-top: 20px;

    color: #777;

    cursor: pointer;
}

.switch span {
    color: #fff;
    font-weight: 700;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
    width: 100%;
    max-width: 1150px;

    margin: auto;

    padding: 25px;
}

.topbar {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;

    margin-bottom: 25px;
}

.brand {
    font-size: 25px;
    font-weight: 900;
}

.account-info {
    color: #777;

    margin-top: 4px;

    font-size: 13px;
}

.logout {
    width: auto !important;

    padding: 9px 15px !important;

    background: #191919 !important;
    color: #fff !important;

    border: 1px solid #333 !important;
}

.grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 20px;
}

.panel {
    background: #111;

    border: 1px solid #292929;

    border-radius: 16px;

    padding: 20px;
}

.panel h2 {
    margin-top: 0;
}

textarea {
    min-height: 360px;

    resize: vertical;

    font-family:
        Consolas,
        monospace;
}

.primary {
    width: 100%;

    padding: 12px;

    border: 0;
    border-radius: 10px;

    background: #fff;
    color: #000;

    font-weight: 700;
}

.secondary {
    width: 100%;

    padding: 11px;

    margin-top: 8px;

    border-radius: 10px;

    background: #191919;
    color: #fff;

    border: 1px solid #333;
}

.scripts {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.script {
    background: #080808;

    border: 1px solid #292929;

    border-radius: 11px;

    padding: 13px;
}

.script-name {
    font-weight: 700;

    margin-bottom: 6px;
}

.script-id {
    color: #666;

    font-size: 11px;

    word-break: break-all;
}

.script-buttons {
    display: flex;

    gap: 7px;

    margin-top: 10px;
}

.script-buttons button {
    flex: 1;

    padding: 8px;

    border-radius: 8px;

    background: #191919;

    color: #fff;

    border: 1px solid #333;
}

.script-buttons .danger {
    background: #301313;

    color: #ff7777;

    border-color: #552020;
}

.empty {
    padding: 35px 0;

    text-align: center;

    color: #666;
}

.loader-box {
    margin-top: 15px;
}

.loader-box textarea {
    min-height: 100px;
}

@media(max-width:800px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .topbar {
        align-items: flex-start;

        flex-direction: column;
    }

}
</style>
</head>

<body>

<!-- =================================================
     LOGIN / REGISTER
================================================= -->

<div
    id="authPage"
    class="auth"
>

    <div class="auth-card">

        <div class="logo">
            LEXINX
        </div>

        <div class="subtitle">
            Protect Dashboard
        </div>


        <!-- LOGIN -->

        <div id="loginBox">

            <input
                id="loginUsername"
                type="text"
                placeholder="Tên tài khoản"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Mật khẩu"
                autocomplete="current-password"
            >

            <button
                onclick="login()"
            >
                Đăng nhập
            </button>

            <div
                id="loginMessage"
                class="message error"
            ></div>

            <div
                class="switch"
                onclick="showRegister()"
            >
                Chưa có tài khoản?
                <span>Đăng ký</span>
            </div>

        </div>


        <!-- REGISTER -->

        <div
            id="registerBox"
            class="hidden"
        >

            <input
                id="registerUsername"
                type="text"
                placeholder="Tên tài khoản"
                autocomplete="username"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Mật khẩu"
                autocomplete="new-password"
            >

            <input
                id="registerPassword2"
                type="password"
                placeholder="Nhập lại mật khẩu"
                autocomplete="new-password"
            >

            <button
                onclick="register()"
            >
                Tạo tài khoản
            </button>

            <div
                id="registerMessage"
                class="message error"
            ></div>

            <div
                class="switch"
                onclick="showLogin()"
            >
                Đã có tài khoản?
                <span>Đăng nhập</span>
            </div>

        </div>

    </div>

</div>


<!-- =================================================
     PRIVATE DASHBOARD
================================================= -->

<div
    id="dashboardPage"
    class="dashboard hidden"
>

    <div class="topbar">

        <div>

            <div class="brand">
                LEXINX Protect
            </div>

            <div class="account-info">

                Tài khoản:
                <strong
                    id="username"
                >
                    -
                </strong>

                <br>

                Account ID:
                <span
                    id="accountId"
                >
                    -
                </span>

            </div>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Đăng xuất
        </button>

    </div>


    <div class="grid">

        <!-- EDITOR -->

        <div class="panel">

            <h2 id="editorTitle">
                Tạo Script
            </h2>

            <input
                id="scriptName"
                type="text"
                placeholder="Tên script"
            >

            <textarea
                id="scriptSource"
                placeholder="Dán Lua source vào đây..."
            ></textarea>

            <button
                class="primary"
                onclick="saveScript()"
            >
                Lưu Script
            </button>

            <button
                class="secondary"
                onclick="clearEditor()"
            >
                Làm mới
            </button>

            <div
                id="editorMessage"
                class="message"
            ></div>

            <div
                id="loaderBox"
                class="loader-box hidden"
            >

                <textarea
                    id="loaderText"
                    readonly
                ></textarea>

                <button
                    class="secondary"
                    onclick="copyLoader()"
                >
                    Copy Loader
                </button>

            </div>

        </div>


        <!-- SCRIPTS -->

        <div class="panel">

            <h2>
                Script của tôi
            </h2>

            <div
                id="scriptList"
                class="scripts"
            >
                <div class="empty">
                    Đang tải...
                </div>
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let editingID = null;


/* =====================================================
   API
===================================================== */

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            {
                credentials:
                    "same-origin",

                ...options,

                headers: {
                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );

    let data = {};

    try {
        data =
            await response.json();
    }
    catch {}

    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed"
        );
    }

    return data;
}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    document
        .getElementById(
            "loginBox"
        )
        .classList
        .remove("hidden");

    document
        .getElementById(
            "registerBox"
        )
        .classList
        .add("hidden");
}


/* =====================================================
   SHOW REGISTER
===================================================== */

function showRegister() {

    document
        .getElementById(
            "loginBox"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "registerBox"
        )
        .classList
        .remove("hidden");
}


/* =====================================================
   REGISTER
===================================================== */

async function register() {

    const username =
        document
            .getElementById(
                "registerUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;

    const password2 =
        document
            .getElementById(
                "registerPassword2"
            )
            .value;

    const message =
        document
            .getElementById(
                "registerMessage"
            );

    message.textContent = "";

    if (
        password !==
        password2
    ) {

        message.textContent =
            "Mật khẩu nhập lại không giống nhau.";

        return;
    }

    try {

        const data =
            await api(
                "/api/register",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        /*
         * Đăng ký thành công:
         * server tạo session.
         * Sau đó chuyển thẳng
         * vào URL riêng.
         */

        window.location.href =
            data.url;

    }
    catch (error) {

        message.textContent =
            error.message;
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const username =
        document
            .getElementById(
                "loginUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

    const message =
        document
            .getElementById(
                "loginMessage"
            );

    message.textContent = "";

    try {

        const data =
            await api(
                "/api/login",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        /*
         * Đăng nhập thành công:
         * chuyển đến web riêng.
         */

        window.location.href =
            data.url;

    }
    catch (error) {

        message.textContent =
            error.message;
    }
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    try {

        await api(
            "/api/logout",
            {
                method: "POST"
            }
        );

    }
    catch {}

    /*
     * Sau logout quay về
     * trang đăng nhập.
     */

    window.location.href = "/";
}


/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function checkAuth() {

    try {

        const data =
            await api(
                "/api/me"
            );

        /*
         * Có session nhưng đang ở /
         * thì chuyển về URL riêng.
         */

        if (
            data.url &&
            window.location.pathname === "/"
        ) {

            window.location.href =
                data.url;

            return;
        }

        showDashboard(
            data
        );

    }
    catch {

        /*
         * Không có session:
         * bắt buộc đăng nhập.
         */

        showAuth();
    }
}


/* =====================================================
   SHOW AUTH
===================================================== */

function showAuth() {

    document
        .getElementById(
            "authPage"
        )
        .classList
        .remove("hidden");

    document
        .getElementById(
            "dashboardPage"
        )
        .classList
        .add("hidden");
}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(
    data
) {

    document
        .getElementById(
            "authPage"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "dashboardPage"
        )
        .classList
        .remove("hidden");

    document
        .getElementById(
            "username"
        )
        .textContent =
            data.username || "-";

    document
        .getElementById(
            "accountId"
        )
        .textContent =
            data.accountId || "-";

    loadScripts();
}


/* =====================================================
   LOAD SCRIPTS
===================================================== */

async function loadScripts() {

    const list =
        document
            .getElementById(
                "scriptList"
            );

    try {

        const data =
            await api(
                "/api/scripts"
            );

        if (
            !data.scripts ||
            data.scripts.length === 0
        ) {

            list.innerHTML =
                `
                <div class="empty">
                    Bạn chưa có script.
                </div>
                `;

            return;
        }

        list.innerHTML =
            data.scripts
                .map(
                    script => {

                        return `
                        <div class="script">

                            <div class="script-name">
                                ${escapeHTML(
                                    script.name
                                )}
                            </div>

                            <div class="script-id">
                                ID:
                                ${escapeHTML(
                                    script.id
                                )}
                            </div>

                            <div class="script-buttons">

                                <button
                                    onclick="editScript(
                                        '${script.id}'
                                    )"
                                >
                                    Edit
                                </button>

                                <button
                                    onclick='copyText(
                                        ${JSON.stringify(
                                            script.loader
                                        )}
                                    )'
                                >
                                    Copy Loader
                                </button>

                                <button
                                    class="danger"
                                    onclick="deleteScript(
                                        '${script.id}'
                                    )"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>
                        `;
                    }
                )
                .join("");

    }
    catch (error) {

        list.innerHTML =
            `
            <div class="error">
                ${escapeHTML(
                    error.message
                )}
            </div>
            `;
    }
}


/* =====================================================
   SAVE
===================================================== */

async function saveScript() {

    const name =
        document
            .getElementById(
                "scriptName"
            )
            .value
            .trim();

    const source =
        document
            .getElementById(
                "scriptSource"
            )
            .value;

    const message =
        document
            .getElementById(
                "editorMessage"
            );

    message.textContent = "";

    try {

        let data;

        if (editingID) {

            data =
                await api(
                    "/api/edit/" +
                    editingID,
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );

            message.textContent =
                "Đã cập nhật script.";

        }
        else {

            data =
                await api(
                    "/api/create",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );

            message.textContent =
                "Đã tạo script.";

            document
                .getElementById(
                    "loaderText"
                )
                .value =
                    data.loader;

            document
                .getElementById(
                    "loaderBox"
                )
                .classList
                .remove("hidden");
        }

        clearFields();

        loadScripts();

    }
    catch (error) {

        message.textContent =
            error.message;
    }
}


/* =====================================================
   EDIT
===================================================== */

async function editScript(
    id
) {

    try {

        const data =
            await api(
                "/api/script/" +
                id
            );

        editingID = id;

        document
            .getElementById(
                "editorTitle"
            )
            .textContent =
                "Edit Script";

        document
            .getElementById(
                "scriptName"
            )
            .value =
                data.script.name;

        document
            .getElementById(
                "scriptSource"
            )
            .value =
                data.script.source;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
    catch (error) {

        alert(
            error.message
        );
    }
}


/* =====================================================
   DELETE
===================================================== */

async function deleteScript(
    id
) {

    if (
        !confirm(
            "Bạn chắc chắn muốn xóa script này?"
        )
    ) {
        return;
    }

    try {

        await api(
            "/api/delete/" +
            id,
            {
                method: "DELETE"
            }
        );

        loadScripts();

    }
    catch (error) {

        alert(
            error.message
        );
    }
}


/* =====================================================
   CLEAR
===================================================== */

function clearFields() {

    editingID = null;

    document
        .getElementById(
            "editorTitle"
        )
        .textContent =
            "Tạo Script";

    document
        .getElementById(
            "scriptName"
        )
        .value = "";

    document
        .getElementById(
            "scriptSource"
        )
        .value = "";
}


function clearEditor() {

    clearFields();

    document
        .getElementById(
            "editorMessage"
        )
        .textContent = "";

    document
        .getElementById(
            "loaderBox"
        )
        .classList
        .add("hidden");
}


/* =====================================================
   COPY
===================================================== */

async function copyText(
    text
) {

    try {

        await navigator
            .clipboard
            .writeText(text);

        alert(
            "Đã copy loader."
        );

    }
    catch {

        prompt(
            "Copy loader:",
            text
        );
    }
}


function copyLoader() {

    const text =
        document
            .getElementById(
                "loaderText"
            )
            .value;

    copyText(text);
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   START
===================================================== */

checkAuth();

</script>

</body>
</html>
