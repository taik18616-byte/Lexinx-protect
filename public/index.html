<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LEXINX Protect</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #08080b;

    color: #eee;

    font-family: Arial, sans-serif;
}

.container {

    max-width: 1000px;

    margin: auto;

    padding: 25px;
}

.panel {

    background: #15151c;

    border:
        1px solid #292936;

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 20px;
}

input,
textarea {

    width: 100%;

    background: #09090d;

    color: white;

    border:
        1px solid #33333f;

    border-radius: 8px;

    padding: 12px;

    margin:
        8px 0 15px;
}

textarea {

    min-height: 230px;

    resize: vertical;

    font-family: monospace;
}

button {

    border: 0;

    border-radius: 7px;

    padding: 10px 15px;

    margin: 4px;

    color: white;

    background: #30303c;

    cursor: pointer;
}

.primary {
    background: #5865f2;
}

.success {
    background: #287a4d;
}

.danger {
    background: #b83232;
}

.script {

    border:
        1px solid #30303c;

    border-radius: 10px;

    padding: 15px;

    margin-top: 12px;
}

.loader {

    background: #08080a;

    border-radius: 7px;

    padding: 10px;

    margin: 10px 0;

    font-family: monospace;

    word-break: break-all;
}

.active {
    color: #4ed68a;
}

.revoked {
    color: #e85b5b;
}

</style>

</head>

<body>

<div class="container">

<h1>LEXINX PROTECT</h1>

<p>
Remote Lua Loader Manager
</p>


<div class="panel">

<h2>Create Loader</h2>

<label>
Script name
</label>

<input
    id="name"
    placeholder="My Script"
>


<label>
Lua payload
</label>

<textarea
    id="payload"
    placeholder='print("67")'
></textarea>


<button
    class="primary"
    onclick="createScript()"
>
Create Loader
</button>

</div>


<div class="panel">

<h2>Scripts</h2>

<div id="scripts">
Loading...
</div>

</div>

</div>


<script>

async function createScript() {

    const name =
        document
        .getElementById("name")
        .value;

    const payload =
        document
        .getElementById("payload")
        .value;

    if (!name.trim()) {

        alert(
            "Script name required"
        );

        return;
    }

    if (!payload.trim()) {

        alert(
            "Payload required"
        );

        return;
    }

    try {

        const response =
            await fetch(
                "/admin/create",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            name,
                            payload
                        })
                }
            );

        const data =
            await response.json();

        if (!data.ok) {

            alert(
                data.error ||
                "Create failed"
            );

            return;
        }

        await navigator
            .clipboard
            .writeText(
                data.script.loader
            );

        alert(
            "Loader created and copied!"
        );

        document
            .getElementById("name")
            .value = "";

        document
            .getElementById("payload")
            .value = "";

        loadScripts();

    } catch (error) {

        alert(
            "Network error"
        );
    }
}


async function loadScripts() {

    const container =
        document
        .getElementById("scripts");

    try {

        const response =
            await fetch(
                "/admin/list"
            );

        const data =
            await response.json();

        if (!data.ok) {

            container.innerHTML =
                "Failed.";

            return;
        }

        if (
            data.scripts.length === 0
        ) {

            container.innerHTML =
                "No scripts.";

            return;
        }

        container.innerHTML = "";

        for (
            const script
            of data.scripts
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "script";

            const name =
                escapeHtml(
                    script.name
                );

            const id =
                escapeHtml(
                    script.id
                );

            const loader =
                escapeHtml(
                    script.loader
                );

            div.innerHTML = `

                <b>${name}</b>

                <div>
                    ID: ${id}
                </div>

                <div class="${
                    script.active
                        ? "active"
                        : "revoked"
                }">

                    ${
                        script.active
                            ? "ACTIVE"
                            : "REVOKED"
                    }

                </div>

                <div class="loader">
                    ${loader}
                </div>

                <button
                    class="success"
                    onclick='copyLoader(
                        ${JSON.stringify(
                            script.loader
                        )}
                    )'
                >
                    Copy Loader
                </button>

                ${
                    script.active

                    ?

                    `<button
                        class="danger"
                        onclick="revokeScript(
                            '${id}'
                        )"
                    >
                        Revoke
                    </button>`

                    :

                    `<button
                        class="primary"
                        onclick="enableScript(
                            '${id}'
                        )"
                    >
                        Enable
                    </button>`
                }

                <button
                    onclick="deleteScript(
                        '${id}'
                    )"
                >
                    Delete
                </button>
            `;

            container.appendChild(
                div
            );
        }

    } catch {

        container.innerHTML =
            "Network error.";
    }
}


async function copyLoader(
    loader
) {

    await navigator
        .clipboard
        .writeText(loader);

    alert(
        "Loader copied!"
    );
}


async function revokeScript(
    id
) {

    if (
        !confirm(
            "Revoke this script?"
        )
    ) {
        return;
    }

    await fetch(
        "/admin/revoke/" +
        encodeURIComponent(id),
        {
            method: "POST"
        }
    );

    loadScripts();
}


async function enableScript(
    id
) {

    await fetch(
        "/admin/enable/" +
        encodeURIComponent(id),
        {
            method: "POST"
        }
    );

    loadScripts();
}


async function deleteScript(
    id
) {

    if (
        !confirm(
            "Delete this script?"
        )
    ) {
        return;
    }

    await fetch(
        "/admin/delete/" +
        encodeURIComponent(id),
        {
            method: "DELETE"
        }
    );

    loadScripts();
}


function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


loadScripts();

</script>

</body>

</html>
