<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: min(1050px, 94%);
    margin: 40px auto;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
}

.sub {
    color: #777;
    margin-top: 5px;
    margin-bottom: 25px;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
}

.hidden {
    display: none !important;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 10px;

    background: #080808;
    color: white;

    border: 1px solid #303030;
    border-radius: 8px;

    outline: none;
}

textarea {
    min-height: 330px;
    resize: vertical;

    font-family:
        Consolas,
        monospace;
}

button {
    margin-top: 12px;
    padding: 11px 17px;

    border: 0;
    border-radius: 8px;

    background: white;
    color: black;

    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .8;
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.status {
    margin-top: 12px;
    color: #aaa;
    white-space: pre-wrap;
}

.script {
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
}

.script-name {
    font-size: 17px;
    font-weight: bold;
}

.script-id {
    color: #666;
    font-size: 12px;
    margin-top: 5px;
}

.loader {
    background: #050505;
    border: 1px solid #222;
    border-radius: 7px;

    padding: 11px;
    margin-top: 10px;

    font-family: monospace;
    font-size: 12px;

    word-break: break-all;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.buttons button {
    margin-top: 8px;
}

.code {
    font-size: 30px;
    letter-spacing: 7px;
    font-weight: bold;
    margin-top: 15px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
LEXINX PROTECT
</div>

<div class="sub">
Lua Script Protection Panel
</div>

<!-- AUTH -->

<div id="auth">

<div class="card">

<h2>Register</h2>

<input
    id="registerEmail"
    type="email"
    placeholder="Your Gmail address"
>

<button onclick="register()">
CREATE ACCOUNT
</button>

<div
    id="registerStatus"
    class="status"
></div>

</div>

<div class="card">

<h2>Verify Gmail</h2>

<input
    id="verifyEmail"
    type="email"
    placeholder="Gmail"
>

<input
    id="verifyCode"
    maxlength="6"
    inputmode="numeric"
    placeholder="6-digit verification code"
>

<button onclick="verify()">
VERIFY ACCOUNT
</button>

<div
    id="verifyStatus"
    class="status"
></div>

</div>

<div class="card">

<h2>Login</h2>

<input
    id="loginEmail"
    type="email"
    placeholder="Gmail"
>

<input
    id="loginPassword"
    type="password"
    placeholder="Generated password"
>

<button onclick="login()">
LOGIN
</button>

<div
    id="loginStatus"
    class="status"
></div>

</div>

</div>

<!-- PANEL -->

<div
    id="panel"
    class="hidden"
>

<div class="card">

<div>
Logged in as:
<strong id="currentEmail"></strong>
</div>

<button onclick="logout()">
LOGOUT
</button>

</div>

<div class="card">

<h2>Create / Edit Script</h2>

<input
    id="scriptName"
    placeholder="Script name"
>

<textarea
    id="scriptSource"
    placeholder="Paste Lua source here..."
></textarea>

<input
    id="editId"
    placeholder="Leave empty to create a new script"
>

<div class="buttons">

<button onclick="saveScript()">
SAVE SCRIPT
</button>

<button onclick="clearEditor()">
CLEAR
</button>

</div>

<div
    id="scriptStatus"
    class="status"
></div>

</div>

<div class="card">

<h2>Your Scripts</h2>

<button onclick="loadScripts()">
REFRESH
</button>

<div id="scripts"></div>

</div>

</div>

</div>

<script>

let sessionToken =
    localStorage.getItem(
        "LEXINX_SESSION"
    );

/* =========================================================
   API
========================================================= */

async function api(
    url,
    options = {}
) {

    options.headers =
        options.headers || {};

    if (sessionToken) {
        options.headers[
            "X-Session-Token"
        ] = sessionToken;
    }

    const response =
        await fetch(
            url,
            options
        );

    let data;

    try {
        data =
            await response.json();
    } catch {
        data = {
            ok: false,
            error:
                await response.text()
        };
    }

    if (
        response.status === 401
    ) {
        logoutLocal();
    }

    return {
        response,
        data
    };
}

/* =========================================================
   REGISTER
========================================================= */

async function register() {

    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();

    setStatus(
        "registerStatus",
        "Sending..."
    );

    try {

        const {
            response,
            data
        } = await api(
            "/api/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        email
                    })
            }
        );

        if (
            !response.ok ||
            !data.ok
        ) {
            setStatus(
                "registerStatus",
                data.error ||
                "Registration failed"
            );
            return;
        }

        document.getElementById(
            "verifyEmail"
        ).value = email;

        setStatus(
            "registerStatus",
            "Verification email sent. Check your Gmail."
        );

    } catch (error) {

        setStatus(
            "registerStatus",
            error.message
        );
    }
}

/* =========================================================
   VERIFY
========================================================= */

async function verify() {

    const email =
        document.getElementById(
            "verifyEmail"
        ).value.trim();

    const code =
        document.getElementById(
            "verifyCode"
        ).value.trim();

    setStatus(
        "verifyStatus",
        "Checking..."
    );

    try {

        const {
            response,
            data
        } = await api(
            "/api/verify",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        email,
                        code
                    })
            }
        );

        if (
            !response.ok ||
            !data.ok
        ) {
            setStatus(
                "verifyStatus",
                data.error ||
                "Verification failed"
            );
            return;
        }

        setStatus(
            "verifyStatus",
            "Verified successfully. You can now login."
        );

        document.getElementById(
            "loginEmail"
        ).value = email;

    } catch (error) {

        setStatus(
            "verifyStatus",
            error.message
        );
    }
}

/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    setStatus(
        "loginStatus",
        "Logging in..."
    );

    try {

        const {
            response,
            data
        } = await api(
            "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        email,
                        password
                    })
            }
        );

        if (
            !response.ok ||
            !data.ok
        ) {
            setStatus(
                "loginStatus",
                data.error ||
                "Login failed"
            );
            return;
        }

        sessionToken =
            data.token;

        localStorage.setItem(
            "LEXINX_SESSION",
            sessionToken
        );

        showPanel(
            data.email
        );

    } catch (error) {

        setStatus(
            "loginStatus",
            error.message
        );
    }
}

/* =========================================================
   PANEL
========================================================= */

function showPanel(email) {

    document
        .getElementById("auth")
        .classList.add("hidden");

    document
        .getElementById("panel")
        .classList.remove("hidden");

    document.getElementById(
        "currentEmail"
    ).textContent = email;

    loadScripts();
}

async function checkSession() {

    if (!sessionToken) {
        return;
    }

    try {

        const {
            response,
            data
        } = await api(
            "/api/me"
        );

        if (
            response.ok &&
            data.ok
        ) {
            showPanel(
                data.email
            );
        }

    } catch {
        logoutLocal();
    }
}

/* =========================================================
   SAVE
========================================================= */

async function saveScript() {

    const name =
        document.getElementById(
            "scriptName"
        ).value.trim();

    const source =
        document.getElementById(
            "scriptSource"
        ).value;

    const editId =
        document.getElementById(
            "editId"
        ).value.trim();

    if (!source.trim()) {

        setStatus(
            "scriptStatus",
            "Script is empty."
        );

        return;
    }

    const url =
        editId
            ? "/api/edit/" +
              encodeURIComponent(
                  editId
              )
            : "/api/create";

    try {

        const {
            response,
            data
        } = await api(
            url,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        name,
                        source
                    })
            }
        );

        if (
            !response.ok ||
            !data.ok
        ) {
            setStatus(
                "scriptStatus",
                data.error ||
                "Save failed"
            );
            return;
        }

        document.getElementById(
            "editId"
        ).value = data.id;

        setStatus(
            "scriptStatus",
            "Saved successfully."
        );

        loadScripts();

    } catch (error) {

        setStatus(
            "scriptStatus",
            error.message
        );
    }
}

/* =========================================================
   SCRIPTS
========================================================= */

async function loadScripts() {

    const container =
        document.getElementById(
            "scripts"
        );

    container.innerHTML =
        "Loading...";

    try {

        const {
            response,
            data
        } = await api(
            "/api/scripts"
        );

        if (
            !response.ok ||
            !data.ok
        ) {
            container.innerHTML =
                escapeHtml(
                    data.error ||
                    "Failed"
                );
            return;
        }

        if (
            data.scripts.length === 0
        ) {
            container.innerHTML =
                "No scripts.";
            return;
        }

        container.innerHTML = "";

        data.scripts.forEach(
            script => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "script";

                div.innerHTML = `

<div class="script-name">
    ${escapeHtml(script.name)}
</div>

<div class="script-id">
    ID: ${escapeHtml(script.id)}
</div>

<div class="loader">
    ${escapeHtml(script.loader)}
</div>

<div class="buttons">

<button>
COPY LOADER
</button>

<button>
EDIT
</button>

<button>
DELETE
</button>

</div>
`;

                const buttons =
                    div.querySelectorAll(
                        "button"
                    );

                buttons[0]
                    .onclick =
                    () => copyText(
                        script.loader
                    );

                buttons[1]
                    .onclick =
                    () => editScript(
                        script.id
                    );

                buttons[2]
                    .onclick =
                    () => deleteScript(
                        script.id
                    );

                container.appendChild(
                    div
                );
            }
        );

    } catch (error) {

        container.innerHTML =
            escapeHtml(
                error.message
            );
    }
}

/* =========================================================
   EDIT
========================================================= */

async function editScript(id) {

    /*
       Chỉ load metadata ở đây.
       Source thật vẫn nằm trên server.
    */

    document.getElementById(
        "editId"
    ).value = id;

    setStatus(
        "scriptStatus",
        "Editing script " + id +
        ". Paste the new source below."
    );

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* =========================================================
   DELETE
========================================================= */

async function deleteScript(id) {

    if (
        !confirm(
            "Delete this script?"
        )
    ) {
        return;
    }

    const {
        response,
        data
    } = await api(
        "/api/delete/" +
        encodeURIComponent(id),
        {
            method: "DELETE"
        }
    );

    if (
        !response.ok ||
        !data.ok
    ) {
        alert(
            data.error ||
            "Delete failed"
        );
        return;
    }

    loadScripts();
}

/* =========================================================
   COPY
========================================================= */

async function copyText(text) {

    try {

        await navigator
            .clipboard
            .writeText(text);

        setStatus(
            "scriptStatus",
            "Loader copied."
        );

    } catch {

        prompt(
            "Copy loader:",
            text
        );
    }
}

/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    try {
        await api(
            "/api/logout",
            {
                method: "POST"
            }
        );
    } catch {}

    logoutLocal();
}

function logoutLocal() {

    sessionToken = null;

    localStorage.removeItem(
        "LEXINX_SESSION"
    );

    document
        .getElementById("panel")
        .classList.add("hidden");

    document
        .getElementById("auth")
        .classList.remove("hidden");
}

/* =========================================================
   CLEAR
========================================================= */

function clearEditor() {

    document.getElementById(
        "scriptName"
    ).value = "";

    document.getElementById(
        "scriptSource"
    ).value = "";

    document.getElementById(
        "editId"
    ).value = "";
}

/* =========================================================
   HELPERS
========================================================= */

function setStatus(
    id,
    text
) {
    document.getElementById(
        id
    ).textContent = text;
}

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

/* =========================================================
   START
========================================================= */

checkSession();

</script>

</body>
</html>
