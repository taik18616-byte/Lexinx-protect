<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at top,
            #191919,
            #050505 55%
        );
    color: #fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container {
    width:
        min(1100px, 94%);
    margin:
        30px auto 60px;
}

.logo {
    text-align:
        center;
    font-size:
        34px;
    font-weight:
        900;
    letter-spacing:
        7px;
}

.subtitle {
    text-align:
        center;
    color:
        #888;
    margin:
        8px 0 28px;
}

.card {
    background:
        rgba(15,15,15,.96);
    border:
        1px solid #292929;
    border-radius:
        15px;
    padding:
        20px;
    margin-bottom:
        20px;
    box-shadow:
        0 15px 45px
        rgba(0,0,0,.25);
}

label {
    display:
        block;
    margin-top:
        12px;
    color:
        #bbb;
    font-size:
        14px;
}

input,
textarea {
    width:
        100%;
    background:
        #070707;
    color:
        #fff;
    border:
        1px solid #333;
    border-radius:
        9px;
    padding:
        12px;
    margin-top:
        7px;
    outline:
        none;
}

input:focus,
textarea:focus {
    border-color:
        #777;
}

textarea {
    min-height:
        330px;
    resize:
        vertical;
    font-family:
        monospace;
    line-height:
        1.45;
}

.row {
    display:
        flex;
    gap:
        10px;
    flex-wrap:
        wrap;
}

button {
    border:
        0;
    border-radius:
        9px;
    padding:
        11px 16px;
    margin-top:
        12px;
    cursor:
        pointer;
    font-weight:
        800;
}

.primary {
    background:
        #fff;
    color:
        #000;
}

.secondary {
    background:
        #242424;
    color:
        #fff;
}

.danger {
    background:
        #4b1515;
    color:
        #fff;
}

.status {
    color:
        #aaa;
    margin-top:
        14px;
}

.loader {
    background:
        #030303;
    border:
        1px solid #292929;
    border-radius:
        9px;
    padding:
        12px;
    margin-top:
        10px;
    font-family:
        monospace;
    word-break:
        break-all;
}

.script {
    border:
        1px solid #292929;
    border-radius:
        11px;
    padding:
        15px;
    margin-top:
        12px;
}

.title {
    font-size:
        17px;
    font-weight:
        800;
}

.meta {
    color:
        #777;
    font-size:
        12px;
    margin-top:
        5px;
}

.empty {
    color:
        #666;
    padding:
        20px 0;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
    LEXINX
</div>

<div class="subtitle">
    PROTECT
</div>

<div class="card">

<h2>Create / Edit</h2>

<label>
    Script name
</label>

<input
    id="name"
    placeholder="My Script"
/>

<label>
    Lua source
</label>

<textarea
    id="source"
    placeholder="Paste Lua source here..."
></textarea>

<div class="row">

<button
    class="primary"
    id="createBtn"
    onclick="createScript()"
>
    PROTECT + BUILD
</button>

<button
    class="secondary"
    onclick="clearEditor()"
>
    CLEAR
</button>

</div>

<div
    id="status"
    class="status"
></div>

</div>

<div class="card">

<div class="row">

<h2 style="margin-right:auto">
    Scripts
</h2>

<button
    class="secondary"
    onclick="loadScripts()"
>
    REFRESH
</button>

</div>

<div id="scripts">
    <div class="empty">
        Loading...
    </div>
</div>

</div>

</div>

<script>

let editingID = null;

function esc(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

async function createScript() {

    const name =
        document.getElementById(
            "name"
        ).value;

    const source =
        document.getElementById(
            "source"
        ).value;

    const status =
        document.getElementById(
            "status"
        );

    if (
        !source.trim()
    ) {

        status.textContent =
            "Lua source is empty.";

        return;
    }

    status.textContent =
        editingID
            ? "Rebuilding..."
            : "Building...";

    try {

        let response;

        if (editingID) {

            response =
                await fetch(
                    "/api/scripts/" +
                    encodeURIComponent(
                        editingID
                    ),
                    {
                        method:
                            "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );

        } else {

            response =
                await fetch(
                    "/api/create",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );
        }

        const data =
            await response.json();

        if (!data.ok) {

            status.textContent =
                data.error ||
                "Build failed.";

            return;
        }

        editingID = null;

        status.innerHTML = `
            <b>Build successful.</b>
            <div class="loader">
                ${esc(data.loader)}
            </div>
            <button
                class="secondary"
                onclick='copyLoader(${JSON.stringify(data.loader)})'
            >
                COPY FULL LOADER
            </button>
        `;

        clearEditor(false);

        await loadScripts();

    } catch (error) {

        status.textContent =
            "Server error: " +
            error.message;
    }
}

async function loadScripts() {

    const box =
        document.getElementById(
            "scripts"
        );

    try {

        const response =
            await fetch(
                "/api/scripts",
                {
                    cache:
                        "no-store"
                }
            );

        const data =
            await response.json();

        if (
            !data.ok ||
            !data.scripts.length
        ) {

            box.innerHTML =
                `<div class="empty">
                    No scripts.
                 </div>`;

            return;
        }

        box.innerHTML =
            data.scripts
                .map(
                    script => `

                    <div
                        class="script"
                    >

                        <div
                            class="title"
                        >
                            ${esc(
                                script.name
                            )}
                        </div>

                        <div
                            class="meta"
                        >
                            ID:
                            ${esc(
                                script.id
                            )}

                            <br>

                            BUILD:
                            ${esc(
                                script.build
                            )}
                        </div>

                        <div
                            class="loader"
                        >
                            ${esc(
                                script.loader
                            )}
                        </div>

                        <div
                            class="row"
                        >

                            <button
                                class="primary"
                                onclick='copyLoader(${JSON.stringify(script.loader)})'
                            >
                                COPY FULL LOADER
                            </button>

                            <button
                                class="secondary"
                                onclick='editScript(${JSON.stringify(script.id)})'
                            >
                                EDIT
                            </button>

                            <button
                                class="danger"
                                onclick='deleteScript(${JSON.stringify(script.id)})'
                            >
                                DELETE
                            </button>

                        </div>

                    </div>
                `
                )
                .join("");

    } catch (error) {

        box.innerHTML =
            `<div class="empty">
                Failed to load scripts.
             </div>`;
    }
}

async function editScript(id) {

    try {

        const response =
            await fetch(
                "/api/scripts/" +
                encodeURIComponent(
                    id
                )
            );

        const data =
            await response.json();

        if (!data.ok) {

            alert(
                data.error ||
                "Failed."
            );

            return;
        }

        editingID =
            data.script.id;

        document.getElementById(
            "name"
        ).value =
            data.script.name;

        document.getElementById(
            "source"
        ).value =
            data.script.source;

        document.getElementById(
            "createBtn"
        ).textContent =
            "REBUILD SCRIPT";

        document.getElementById(
            "status"
        ).textContent =
            "Editing " +
            data.script.name;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch {

        alert(
            "Unable to load script."
        );
    }
}

async function deleteScript(id) {

    if (
        !confirm(
            "Delete this script?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/scripts/" +
                encodeURIComponent(
                    id
                ),
                {
                    method:
                        "DELETE"
                }
            );

        const data =
            await response.json();

        if (!data.ok) {

            alert(
                data.error ||
                "Delete failed."
            );

            return;
        }

        loadScripts();

    } catch {

        alert(
            "Delete failed."
        );
    }
}

async function copyLoader(loader) {

    try {

        await navigator
            .clipboard
            .writeText(
                loader
            );

        alert(
            "Full loader copied!"
        );

    } catch {

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            loader;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        alert(
            "Full loader copied!"
        );
    }
}

function clearEditor(
    resetStatus = true
) {

    editingID = null;

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "source"
    ).value = "";

    document.getElementById(
        "createBtn"
    ).textContent =
        "PROTECT + BUILD";

    if (resetStatus) {

        document.getElementById(
            "status"
        ).textContent = "";
    }
}

/*
    Upload Lua/TXT mà không cần multer.
    Browser đọc file thành text rồi
    đưa source lên /api/create.
*/

const fileInput =
    document.createElement(
        "input"
    );

fileInput.type =
    "file";

fileInput.accept =
    ".lua,.txt,text/plain";

fileInput.style.display =
    "none";

document.body.appendChild(
    fileInput
);

const uploadButton =
    document.createElement(
        "button"
    );

uploadButton.className =
    "secondary";

uploadButton.textContent =
    "UPLOAD LUA / TXT";

uploadButton.onclick =
    () => fileInput.click();

document
    .getElementById("source")
    .parentElement
    .querySelector(".row")
    .appendChild(
        uploadButton
    );

fileInput.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) return;

        const text =
            await file.text();

        document.getElementById(
            "source"
        ).value =
            text;

        document.getElementById(
            "name"
        ).value =
            file.name
                .replace(
                    /\.(lua|txt)$/i,
                    ""
                );
    }
);

loadScripts();

</script>

</body>

</html>
