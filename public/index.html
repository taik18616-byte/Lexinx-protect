<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEXINX Protect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: #fff;
            font-family:
                Arial,
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .center {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 28px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-top: 6px;
            margin-bottom: 25px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #303030;
            background: #080808;
            color: #fff;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #666;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: #fff;
            color: #000;
            font-weight: 700;
        }

        button.secondary {
            margin-top: 10px;
            background: #191919;
            color: #fff;
            border: 1px solid #333;
        }

        .switch {
            text-align: center;
            color: #777;
            margin-top: 18px;
            cursor: pointer;
        }

        .switch span {
            color: #fff;
            font-weight: bold;
        }

        .message {
            margin-top: 12px;
            text-align: center;
            color: #ff6b6b;
        }

        .dashboard {
            max-width: 1150px;
            margin: auto;
            padding: 25px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
        }

        .account {
            color: #777;
            margin-top: 5px;
        }

        .logout {
            width: auto;
            padding: 9px 18px;
            background: #191919;
            color: #fff;
            border: 1px solid #333;
        }

        .grid {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);
            gap: 20px;
        }

        .panel {
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 20px;
        }

        .panel h2 {
            margin-top: 0;
        }

        textarea {
            min-height: 350px;
            resize: vertical;
            font-family: monospace;
        }

        .script-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .script {
            background: #080808;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 13px;
        }

        .script-name {
            font-weight: 700;
        }

        .script-id {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .actions button {
            padding: 8px;
        }

        .delete {
            background: #301414;
            color: #ff8585;
            border: 1px solid #552020;
        }

        .empty {
            color: #666;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- ==================================================
     AUTH
================================================== -->

<div
    id="auth"
    class="center"
>
    <div class="card">

        <div class="logo">
            LEXINX
        </div>

        <div class="subtitle">
            Protect Dashboard
        </div>

        <!-- LOGIN -->

        <div id="loginBox">

            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                onclick="login()"
            >
                Đăng nhập
            </button>

            <div
                id="loginMessage"
                class="message"
            ></div>

            <div
                class="switch"
                onclick="showRegister()"
            >
                Chưa có tài khoản?
                <span>Đăng ký</span>
            </div>

        </div>

        <!-- REGISTER -->

        <div
            id="registerBox"
            class="hidden"
        >

            <input
                id="registerUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <input
                id="registerPassword2"
                type="password"
                placeholder="Nhập lại password"
                autocomplete="new-password"
            >

            <button
                onclick="registerAccount()"
            >
                Tạo tài khoản
            </button>

            <div
                id="registerMessage"
                class="message"
            ></div>

            <div
                class="switch"
                onclick="showLogin()"
            >
                Đã có tài khoản?
                <span>Đăng nhập</span>
            </div>

        </div>

    </div>
</div>

<!-- ==================================================
     DASHBOARD
================================================== -->

<div
    id="dashboard"
    class="dashboard hidden"
>

    <div class="topbar">

        <div>

            <div class="brand">
                LEXINX Protect
            </div>

            <div class="account">
                Account:
                <strong id="currentUser">
                    -
                </strong>
            </div>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Đăng xuất
        </button>

    </div>

    <div class="grid">

        <!-- EDITOR -->

        <div class="panel">

            <h2 id="editorTitle">
                Tạo Script
            </h2>

            <input
                id="scriptName"
                type="text"
                placeholder="Tên script"
            >

            <textarea
                id="scriptSource"
                placeholder="Nhập Lua source..."
            ></textarea>

            <button
                onclick="saveScript()"
            >
                Lưu Script
            </button>

            <button
                class="secondary"
                onclick="clearEditor()"
            >
                Xóa
            </button>

            <div
                id="editorMessage"
                class="message"
            ></div>

        </div>

        <!-- SCRIPT LIST -->

        <div class="panel">

            <h2>
                Script của tôi
            </h2>

            <div
                id="scriptList"
                class="script-list"
            >
                <div class="empty">
                    Đang tải...
                </div>
            </div>

        </div>

    </div>

</div>

<script>
    let editingID = null;

    /* ==================================================
       API
    ================================================== */

    async function api(
        url,
        options = {}
    ) {
        const response =
            await fetch(
                url,
                {
                    credentials:
                        "same-origin",

                    ...options,

                    headers: {
                        ...(options.body
                            ? {
                                "Content-Type":
                                    "application/json"
                            }
                            : {}),

                        ...(options.headers || {})
                    }
                }
            );

        let data = {};

        try {
            data =
                await response.json();
        } catch {}

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Request failed"
            );
        }

        return data;
    }

    /* ==================================================
       AUTH UI
    ================================================== */

    function showRegister() {
        document
            .getElementById(
                "loginBox"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "registerBox"
            )
            .classList
            .remove("hidden");
    }

    function showLogin() {
        document
            .getElementById(
                "registerBox"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "loginBox"
            )
            .classList
            .remove("hidden");
    }

    /* ==================================================
       REGISTER
    ================================================== */

    async function registerAccount() {

        const username =
            document
                .getElementById(
                    "registerUsername"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;

        const password2 =
            document
                .getElementById(
                    "registerPassword2"
                )
                .value;

        const message =
            document
                .getElementById(
                    "registerMessage"
                );

        message.textContent = "";

        if (
            password !==
            password2
        ) {
            message.textContent =
                "Hai password không giống nhau";
            return;
        }

        try {

            const data =
                await api(
                    "/api/register",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );

            /*
             * Tự động chuyển tới
             * trang riêng của tài khoản.
             */

            window.location.href =
                data.url;

        } catch (error) {

            message.textContent =
                error.message;
        }
    }

    /* ==================================================
       LOGIN
    ================================================== */

    async function login() {

        const username =
            document
                .getElementById(
                    "loginUsername"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;

        const message =
            document
                .getElementById(
                    "loginMessage"
                );

        message.textContent = "";

        try {

            const data =
                await api(
                    "/api/login",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );

            /*
             * Tự động chuyển tới
             * web riêng của tài khoản.
             */

            window.location.href =
                data.url;

        } catch (error) {

            message.textContent =
                error.message;
        }
    }

    /* ==================================================
       LOGOUT
    ================================================== */

    async function logout() {

        try {
            await api(
                "/api/logout",
                {
                    method: "POST"
                }
            );
        } catch {}

        window.location.href =
            "/";
    }

    /* ==================================================
       LOAD USER
    ================================================== */

    async function loadUser() {

        try {

            const data =
                await api(
                    "/api/me"
                );

            document
                .getElementById(
                    "currentUser"
                )
                .textContent =
                    data.username;

            document
                .getElementById(
                    "auth"
                )
                .classList
                .add("hidden");

            document
                .getElementById(
                    "dashboard"
                )
                .classList
                .remove("hidden");

            await loadScripts();

        } catch {

            window.location.href =
                "/";
        }
    }

    /* ==================================================
       LOAD SCRIPTS
    ================================================== */

    async function loadScripts() {

        const list =
            document
                .getElementById(
                    "scriptList"
                );

        try {

            const data =
                await api(
                    "/api/scripts"
                );

            if (
                !data.scripts.length
            ) {
                list.innerHTML =
                    `<div class="empty">
                        Chưa có script
                    </div>`;

                return;
            }

            list.innerHTML =
                data.scripts
                    .map(
                        script => `
                            <div class="script">

                                <div class="script-name">
                                    ${escapeHTML(
                                        script.name
                                    )}
                                </div>

                                <div class="script-id">
                                    ID:
                                    ${escapeHTML(
                                        script.id
                                    )}
                                </div>

                                <div class="actions">

                                    <button
                                        onclick="editScript('${script.id}')"
                                    >
                                        Edit
                                    </button>

                                    <button
                                        class="delete"
                                        onclick="deleteScript('${script.id}')"
                                    >
                                        Delete
                                    </button>

                                </div>

                            </div>
                        `
                    )
                    .join("");

        } catch (error) {

            list.innerHTML =
                `<div class="message">
                    ${escapeHTML(
                        error.message
                    )}
                </div>`;
        }
    }

    /* ==================================================
       SAVE
    ================================================== */

    async function saveScript() {

        const name =
            document
                .getElementById(
                    "scriptName"
                )
                .value
                .trim();

        const source =
            document
                .getElementById(
                    "scriptSource"
                )
                .value;

        const message =
            document
                .getElementById(
                    "editorMessage"
                );

        message.textContent = "";

        try {

            if (!editingID) {

                await api(
                    "/api/create",
                    {
                        method:
                            "POST",

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );

                message.textContent =
                    "Đã tạo script";

            } else {

                await api(
                    "/api/edit/" +
                    editingID,
                    {
                        method:
                            "POST",

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );

                message.textContent =
                    "Đã cập nhật script";
            }

            clearEditor();

            await loadScripts();

        } catch (error) {

            message.textContent =
                error.message;
        }
    }

    /* ==================================================
       EDIT
    ================================================== */

    async function editScript(id) {

        try {

            const data =
                await api(
                    "/api/script/" +
                    id
                );

            editingID =
                id;

            document
                .getElementById(
                    "editorTitle"
                )
                .textContent =
                    "Edit Script";

            document
                .getElementById(
                    "scriptName"
                )
                .value =
                    data.script.name;

            document
                .getElementById(
                    "scriptSource"
                )
                .value =
                    data.script.source;

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    /* ==================================================
       DELETE
    ================================================== */

    async function deleteScript(id) {

        if (
            !confirm(
                "Bạn chắc chắn muốn xóa script này?"
            )
        ) {
            return;
        }

        try {

            await api(
                "/api/delete/" +
                id,
                {
                    method:
                        "DELETE"
                }
            );

            if (
                editingID === id
            ) {
                clearEditor();
            }

            await loadScripts();

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    /* ==================================================
       CLEAR
    ================================================== */

    function clearEditor() {

        editingID = null;

        document
            .getElementById(
                "editorTitle"
            )
            .textContent =
                "Tạo Script";

        document
            .getElementById(
                "scriptName"
            )
            .value = "";

        document
            .getElementById(
                "scriptSource"
            )
            .value = "";

        document
            .getElementById(
                "editorMessage"
            )
            .textContent = "";
    }

    /* ==================================================
       ESCAPE
    ================================================== */

    function escapeHTML(
        value
    ) {
        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

    /* ==================================================
       START
    ================================================== */

    if (
        location.pathname.includes(
            "/dashboard"
        )
    ) {
        loadUser();
    }
</script>

</body>
</html>
