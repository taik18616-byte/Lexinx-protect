<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #181818,
            #050505 55%
        );

    color: white;

    font-family:
        Arial,
        sans-serif;
}

.container {

    width:
        min(900px, 94%);

    margin:
        50px auto;
}

.logo {

    text-align: center;

    font-size: 44px;

    font-weight: 900;

    letter-spacing: 2px;
}

.subtitle {

    text-align: center;

    color: #777;

    margin:
        10px 0 40px;
}

.card {

    background:
        rgba(15,15,15,.95);

    border:
        1px solid #292929;

    border-radius:
        18px;

    padding:
        25px;

    margin-bottom:
        25px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.3);
}

h2 {

    margin-top: 0;
}

input[type=file] {

    width: 100%;

    padding: 15px;

    border:
        1px solid #333;

    border-radius:
        10px;

    background:
        #080808;

    color:
        #aaa;
}

button {

    border: 0;

    border-radius: 9px;

    padding:
        11px 17px;

    margin-top: 12px;

    background: white;

    color: black;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    opacity: .8;
}

.status {

    margin-top:
        15px;

    color:
        #999;
}

.script {

    background:
        #080808;

    border:
        1px solid #242424;

    border-radius:
        12px;

    padding:
        18px;

    margin-top:
        15px;
}

.script-name {

    font-size:
        18px;

    font-weight:
        bold;
}

.script-id {

    margin-top:
        5px;

    color:
        #666;

    font-size:
        12px;
}

.loader {

    margin-top:
        12px;

    padding:
        12px;

    background:
        #000;

    border-radius:
        8px;

    color:
        #aaa;

    font-family:
        monospace;

    font-size:
        12px;

    overflow-x:
        auto;

    white-space:
        nowrap;
}

.actions {

    display:
        flex;

    gap:
        8px;

    flex-wrap:
        wrap;
}

.delete {

    background:
        #222;

    color:
        white;
}

.empty {

    color:
        #666;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
LEXINX PROTECT
</div>

<div class="subtitle">
Lua / TXT Script Protection & Loader Manager
</div>

<div class="card">

<h2>
Upload Script
</h2>

<form id="uploadForm">

<input
    id="file"
    type="file"
    name="script"
    accept=".lua,.txt"
    required
>

<button type="submit">
Protect Script
</button>

</form>

<div
    id="status"
    class="status"
></div>

</div>

<div class="card">

<h2>
Protected Scripts
</h2>

<div id="scripts">
Loading...
</div>

</div>

</div>

<script>

const form =
    document.getElementById(
        "uploadForm"
    );

const status =
    document.getElementById(
        "status"
    );

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const file =
            document.getElementById(
                "file"
            ).files[0];

        if (!file) {
            return;
        }

        status.textContent =
            "Uploading...";

        const body =
            new FormData();

        body.append(
            "script",
            file
        );

        try {

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",
                        body
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Upload failed"
                );
            }

            status.textContent =
                "Protected: " +
                data.id;

            form.reset();

            await loadScripts();

        } catch (error) {

            status.textContent =
                "ERROR: " +
                error.message;
        }
    }
);

async function loadScripts() {

    const box =
        document.getElementById(
            "scripts"
        );

    try {

        const response =
            await fetch(
                "/api/scripts"
            );

        const data =
            await response.json();

        if (
            !data.ok ||
            !data.scripts.length
        ) {

            box.innerHTML =
                `<div class="empty">
                    No scripts uploaded.
                </div>`;

            return;
        }

        box.innerHTML = "";

        for (
            const script
            of data.scripts
        ) {

            const loader =
                `loadstring(game:HttpGet("${location.origin}/api/${script.id}"))()`;

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "script";

            item.innerHTML = `

                <div class="script-name">
                    ${escapeHTML(
                        script.name
                    )}
                </div>

                <div class="script-id">
                    ID: ${escapeHTML(
                        script.id
                    )}
                </div>

                <div class="loader">
                    ${escapeHTML(
                        loader
                    )}
                </div>

                <div class="actions">

                    <button class="copy">
                        Copy Loader
                    </button>

                    <button class="delete">
                        Delete
                    </button>

                </div>
            `;

            item
                .querySelector(".copy")
                .addEventListener(
                    "click",
                    async () => {

                        await navigator
                            .clipboard
                            .writeText(
                                loader
                            );

                        item
                            .querySelector(
                                ".copy"
                            )
                            .textContent =
                            "Copied!";
                    }
                );

            item
                .querySelector(".delete")
                .addEventListener(
                    "click",
                    async () => {

                        const yes =
                            confirm(
                                "Delete this script?"
                            );

                        if (!yes) {
                            return;
                        }

                        const result =
                            await fetch(
                                "/api/scripts/" +
                                encodeURIComponent(
                                    script.id
                                ),
                                {
                                    method:
                                        "DELETE"
                                }
                            );

                        if (
                            result.ok
                        ) {
                            loadScripts();
                        }
                    }
                );

            box.appendChild(
                item
            );
        }

    } catch {

        box.innerHTML =
            `<div class="empty">
                Failed to load scripts.
            </div>`;
    }
}

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}

loadScripts();

</script>

</body>

</html>
