<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEXINX PROTECT</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:30px 15px;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

h1{
    margin:0 0 8px;
    font-size:28px;
    letter-spacing:1px;
}

h2{
    margin:0 0 18px;
    font-size:20px;
}

p{
    color:#aaa;
}

input,
textarea{
    width:100%;
    display:block;

    background:#080808;
    color:#fff;

    border:1px solid #303030;
    border-radius:9px;

    padding:13px;
    margin:10px 0;

    outline:none;
    font-size:14px;
}

input:focus,
textarea:focus{
    border-color:#777;
}

textarea{
    min-height:300px;
    resize:vertical;
    font-family:Consolas,monospace;
    line-height:1.5;
}

button{
    border:0;
    border-radius:9px;

    padding:12px 16px;
    margin:5px 4px 5px 0;

    background:#fff;
    color:#000;

    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

button.gray{
    background:#292929;
    color:#fff;
}

button.red{
    background:#8b1e1e;
    color:#fff;
}

.status{
    min-height:20px;
    color:#aaa;
    margin:10px 0;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.badge{
    display:inline-block;

    padding:5px 9px;

    border-radius:20px;

    background:#222;
    color:#aaa;

    font-size:11px;
}

.script{
    background:#090909;

    border:1px solid #282828;
    border-radius:10px;

    padding:16px;
    margin:12px 0;
}

.script-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:7px;
}

.small{
    color:#666;
    font-size:12px;
    margin-bottom:10px;
}

.loader{
    background:#050505;

    border:1px solid #252525;
    border-radius:7px;

    padding:12px;

    color:#bbb;

    font-family:Consolas,monospace;
    font-size:12px;

    word-break:break-all;
}

#accountInfo{
    line-height:1.8;
    color:#bbb;
}

@media(max-width:600px){

    .container{
        padding:15px 10px;
    }

    .card{
        padding:18px;
    }

    .top{
        align-items:flex-start;
        flex-direction:column;
    }

    h1{
        font-size:23px;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- =====================================================
     REGISTER
===================================================== -->

<div id="registerPage" class="card">

    <h1>LEXINX PROTECT</h1>

    <p>Create your account</p>

    <input
        id="registerUsername"
        type="text"
        placeholder="Username"
        autocomplete="username">

    <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        autocomplete="new-password">

    <input
        id="registerCode"
        type="text"
        placeholder="Access Code">

    <button onclick="register()">
        Create Account
    </button>

    <div
        id="registerStatus"
        class="status">
    </div>

    <button
        class="gray"
        onclick="showLogin()">

        Already have an account?
        Login

    </button>

</div>


<!-- =====================================================
     LOGIN
===================================================== -->

<div
    id="loginPage"
    class="card hidden">

    <h1>LEXINX PROTECT</h1>

    <p>Login to continue</p>

    <input
        id="loginUsername"
        type="text"
        placeholder="Username"
        autocomplete="username">

    <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password">

    <button onclick="login()">
        Login
    </button>

    <div
        id="loginStatus"
        class="status">
    </div>

    <button
        class="gray"
        onclick="showRegister()">

        Create new account

    </button>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div
    id="dashboardPage"
    class="hidden">


    <!-- HEADER -->

    <div class="card">

        <div class="top">

            <div>

                <h1>
                    LEXINX PROTECT
                </h1>

                <span class="badge">
                    SCRIPT PANEL
                </span>

            </div>

            <button
                class="gray"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>


    <!-- ACCOUNT -->

    <div class="card">

        <h2>
            Account
        </h2>

        <div id="accountInfo">
            Loading...
        </div>

    </div>


    <!-- SCRIPT EDITOR -->

    <div class="card">

        <h2 id="editorTitle">
            Create Script
        </h2>

        <input
            id="scriptName"
            type="text"
            placeholder="Script name">

        <textarea
            id="scriptSource"
            placeholder="Paste your Lua source here..."></textarea>

        <button
            id="createBtn"
            onclick="createScript()">

            Create Script

        </button>

        <button
            id="saveBtn"
            class="hidden"
            onclick="saveScript()">

            Save Changes

        </button>

        <button
            id="cancelBtn"
            class="gray hidden"
            onclick="cancelEdit()">

            Cancel

        </button>

        <div
            id="editorStatus"
            class="status">
        </div>

    </div>


    <!-- SCRIPT LIST -->

    <div class="card">

        <div class="top">

            <h2>
                My Scripts
            </h2>

            <button
                class="gray"
                onclick="loadScripts()">

                Refresh

            </button>

        </div>

        <div id="scriptList">
            Loading...
        </div>

    </div>

</div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let editingID = null;


/* =====================================================
   PAGE SYSTEM
===================================================== */

function hideAllPages(){

    document
        .getElementById("registerPage")
        .classList
        .add("hidden");

    document
        .getElementById("loginPage")
        .classList
        .add("hidden");

    document
        .getElementById("dashboardPage")
        .classList
        .add("hidden");
}


function showRegister(){

    hideAllPages();

    document
        .getElementById("registerPage")
        .classList
        .remove("hidden");
}


function showLogin(){

    hideAllPages();

    document
        .getElementById("loginPage")
        .classList
        .remove("hidden");
}


function showDashboard(){

    hideAllPages();

    document
        .getElementById("dashboardPage")
        .classList
        .remove("hidden");

    loadAccount();
    loadScripts();
}


/* =====================================================
   API HELPER
===================================================== */

async function api(url, options = {}){

    const headers = {
        ...(options.headers || {})
    };

    if(options.body){
        headers["Content-Type"] =
            "application/json";
    }

    const response =
        await fetch(
            url,
            {
                ...options,

                headers,

                credentials:
                    "same-origin"
            }
        );

    let data;

    try{

        data =
            await response.json();

    }catch{

        data = {
            ok:false,
            error:
                await response.text()
        };

    }

    return {
        response,
        data
    };
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const username =
        document
            .getElementById(
                "registerUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;

    const code =
        document
            .getElementById(
                "registerCode"
            )
            .value
            .trim();

    const status =
        document
            .getElementById(
                "registerStatus"
            );


    if(
        !username ||
        !password ||
        !code
    ){

        status.textContent =
            "Please fill in all fields.";

        return;
    }


    status.textContent =
        "Creating account...";


    const result =
        await api(
            "/api/register",
            {
                method:"POST",

                body:
                    JSON.stringify({
                        username,
                        password,
                        code
                    })
            }
        );


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        status.textContent =
            result.data.error ||
            "Registration failed.";

        return;
    }


    /*
        Không tự động login.

        Register xong:
        → Login
    */

    document
        .getElementById(
            "loginUsername"
        )
        .value =
        username;

    document
        .getElementById(
            "loginPassword"
        )
        .value = "";

    document
        .getElementById(
            "loginStatus"
        )
        .textContent =
        "Account created. Please login.";

    showLogin();
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const username =
        document
            .getElementById(
                "loginUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

    const status =
        document
            .getElementById(
                "loginStatus"
            );


    if(
        !username ||
        !password
    ){

        status.textContent =
            "Enter username and password.";

        return;
    }


    status.textContent =
        "Logging in...";


    const result =
        await api(
            "/api/login",
            {
                method:"POST",

                body:
                    JSON.stringify({
                        username,
                        password
                    })
            }
        );


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        status.textContent =
            result.data.error ||
            "Login failed.";

        return;
    }


    /*
        Login thành công:
        → Dashboard
    */

    showDashboard();
}


/* =====================================================
   SESSION CHECK
===================================================== */

async function checkSession(){

    const result =
        await api("/api/me");


    if(
        result.response.ok &&
        result.data.ok
    ){

        showDashboard();

    }else{

        showRegister();

    }
}


/* =====================================================
   ACCOUNT
===================================================== */

async function loadAccount(){

    const result =
        await api("/api/me");


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        showLogin();

        return;
    }


    const account =
        result.data;


    document
        .getElementById(
            "accountInfo"
        )
        .innerHTML = `

            <b>Username:</b>
            ${escapeHTML(
                account.username
            )}

            <br>

            <b>Access:</b>
            ${escapeHTML(
                account.accessType ||
                "Account"
            )}

            <br>

            <b>Scripts:</b>
            ${Number(
                account.scriptCount || 0
            )}

        `;
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await api(
        "/api/logout",
        {
            method:"POST"
        }
    );

    editingID = null;

    cancelEdit();

    showLogin();
}


/* =====================================================
   CREATE SCRIPT
===================================================== */

async function createScript(){

    const name =
        document
            .getElementById(
                "scriptName"
            )
            .value
            .trim();

    const source =
        document
            .getElementById(
                "scriptSource"
            )
            .value;

    const status =
        document
            .getElementById(
                "editorStatus"
            );


    if(!source.trim()){

        status.textContent =
            "Script is empty.";

        return;
    }


    status.textContent =
        "Creating script...";


    const result =
        await api(
            "/api/create",
            {
                method:"POST",

                body:
                    JSON.stringify({
                        name:
                            name ||
                            "Script",

                        source
                    })
            }
        );


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        status.textContent =
            result.data.error ||
            "Create failed.";

        return;
    }


    status.textContent =
        "Script created successfully.";


    document
        .getElementById(
            "scriptName"
        )
        .value = "";

    document
        .getElementById(
            "scriptSource"
        )
        .value = "";


    loadAccount();
    loadScripts();
}


/* =====================================================
   LOAD SCRIPTS
===================================================== */

async function loadScripts(){

    const list =
        document
            .getElementById(
                "scriptList"
            );


    list.textContent =
        "Loading...";


    const result =
        await api(
            "/api/scripts"
        );


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        list.textContent =
            result.data.error ||
            "Unable to load scripts.";

        return;
    }


    const scripts =
        result.data.scripts || [];


    if(!scripts.length){

        list.innerHTML =
            "<p>No scripts yet.</p>";

        return;
    }


    list.innerHTML =
        scripts
            .map(script => {

                return `

                <div class="script">

                    <div class="script-name">

                        ${escapeHTML(
                            script.name
                        )}

                    </div>


                    <div class="small">

                        ID:
                        ${escapeHTML(
                            script.id
                        )}

                    </div>


                    <div class="loader">

                        ${escapeHTML(
                            script.loader
                        )}

                    </div>


                    <br>


                    <button
                        onclick='copyLoader(${JSON.stringify(script.loader)})'>

                        Copy Loader

                    </button>


                    <button
                        class="gray"
                        onclick='editScript(${JSON.stringify(script.id)})'>

                        Edit

                    </button>


                    <button
                        class="red"
                        onclick='deleteScript(${JSON.stringify(script.id)})'>

                        Delete

                    </button>

                </div>

                `;

            })
            .join("");
}


/* =====================================================
   EDIT SCRIPT
===================================================== */

async function editScript(id){

    const result =
        await api(
            "/api/scripts/" +
            encodeURIComponent(id)
        );


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        alert(
            result.data.error ||
            "Unable to load script."
        );

        return;
    }


    const script =
        result.data.script;


    editingID =
        script.id;


    document
        .getElementById(
            "scriptName"
        )
        .value =
        script.name;


    document
        .getElementById(
            "scriptSource"
        )
        .value =
        script.source;


    document
        .getElementById(
            "editorTitle"
        )
        .textContent =
        "Edit Script";


    document
        .getElementById(
            "createBtn"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "saveBtn"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "cancelBtn"
        )
        .classList
        .remove("hidden");


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   SAVE SCRIPT
===================================================== */

async function saveScript(){

    if(!editingID)
        return;


    const name =
        document
            .getElementById(
                "scriptName"
            )
            .value
            .trim();


    const source =
        document
            .getElementById(
                "scriptSource"
            )
            .value;


    const result =
        await api(
            "/api/scripts/" +
            encodeURIComponent(
                editingID
            ),
            {
                method:"PUT",

                body:
                    JSON.stringify({
                        name:
                            name ||
                            "Script",

                        source
                    })
            }
        );


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        document
            .getElementById(
                "editorStatus"
            )
            .textContent =
            result.data.error ||
            "Save failed.";

        return;
    }


    document
        .getElementById(
            "editorStatus"
        )
        .textContent =
        "Saved successfully.";


    loadAccount();
    loadScripts();
}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

    editingID = null;


    document
        .getElementById(
            "editorTitle"
        )
        .textContent =
        "Create Script";


    document
        .getElementById(
            "createBtn"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "saveBtn"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "cancelBtn"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "scriptName"
        )
        .value = "";


    document
        .getElementById(
            "scriptSource"
        )
        .value = "";


    document
        .getElementById(
            "editorStatus"
        )
        .textContent = "";
}


/* =====================================================
   DELETE
===================================================== */

async function deleteScript(id){

    if(
        !confirm(
            "Delete this script?"
        )
    ){

        return;
    }


    const result =
        await api(
            "/api/scripts/" +
            encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );


    if(
        !result.response.ok ||
        !result.data.ok
    ){

        alert(
            result.data.error ||
            "Delete failed."
        );

        return;
    }


    if(editingID === id){

        cancelEdit();
    }


    loadAccount();
    loadScripts();
}


/* =====================================================
   COPY LOADER
===================================================== */

async function copyLoader(loader){

    try{

        await navigator
            .clipboard
            .writeText(loader);

        alert(
            "Loader copied!"
        );

    }catch{

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            loader;

        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";

        document
            .body
            .appendChild(
                textarea
            );

        textarea.focus();
        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        alert(
            "Loader copied!"
        );
    }
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =====================================================
   START
===================================================== */

checkSession();

</script>

</body>
</html>
