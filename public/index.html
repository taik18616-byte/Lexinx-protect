<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: min(1000px, 94%);
    margin: 30px auto;
}

.card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

input,
textarea {
    width: 100%;
    background: #080808;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    outline: none;
}

textarea {
    min-height: 350px;
    resize: vertical;
    font-family: Consolas, monospace;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 15px;
    margin: 3px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: white;
    color: black;
}

.danger {
    background: #351010;
    color: #ff7777;
}

.script {
    background: #080808;
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
}

.id {
    color: #777;
    font-size: 12px;
    margin: 8px 0;
    word-break: break-all;
}

pre {
    white-space: pre-wrap;
    word-break: break-all;
    background: #030303;
    border: 1px solid #222;
    padding: 12px;
    border-radius: 8px;
    max-height: 300px;
    overflow: auto;
}

#message {
    color: #aaa;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>LEXINX PROTECT</h1>

<p>Upload / Paste Lua Source</p>

<input
    id="name"
    placeholder="Script name"
>

<textarea
    id="source"
    placeholder="Paste your Lua source here..."
></textarea>

<input
    id="editID"
    type="hidden"
>

<button
    class="primary"
    onclick="createScript()"
>
CREATE
</button>

<button
    onclick="saveEdit()"
>
SAVE EDIT
</button>

<button
    onclick="clearEditor()"
>
CLEAR
</button>

<p id="message"></p>

</div>

<div class="card">

<h2>Scripts</h2>

<button onclick="loadScripts()">
REFRESH
</button>

<div id="scripts">
Loading...
</div>

</div>

</div>

<script>

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");

}

async function copyText(text) {

    try {

        await navigator.clipboard.writeText(text);

    } catch {

        const area =
            document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

    }

}

async function createScript() {

    const name =
        document.getElementById("name").value;

    const source =
        document.getElementById("source").value;

    if (!source.trim()) {

        alert("Script is empty.");

        return;

    }

    const response =
        await fetch("/api/create", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                name,
                source
            })

        });

    const data =
        await response.json();

    if (!data.ok) {

        alert(
            data.error ||
            "Create failed"
        );

        return;

    }

    /*
        COPY LAYER 1

        Ví dụ:

        loadstring(game:HttpGet(
            "https://domain/api/loader/ID"
        ))()
    */

    await copyText(
        data.layer1
    );

    document.getElementById("message")
        .textContent =
        "Created — Layer 1 copied.";

    clearEditor();

    loadScripts();

}

async function saveEdit() {

    const id =
        document.getElementById("editID").value;

    if (!id) {

        alert(
            "Choose EDIT first."
        );

        return;

    }

    const name =
        document.getElementById("name").value;

    const source =
        document.getElementById("source").value;

    const response =
        await fetch(
            "/api/edit/" +
            encodeURIComponent(id),
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name,
                    source
                })

            }
        );

    const data =
        await response.json();

    if (!data.ok) {

        alert(
            data.error ||
            "Edit failed"
        );

        return;

    }

    await copyText(
        data.layer1
    );

    document.getElementById("message")
        .textContent =
        "Updated — new Layer 1 copied.";

    clearEditor();

    loadScripts();

}

async function editScript(id) {

    const response =
        await fetch(
            "/api/source/" +
            encodeURIComponent(id)
        );

    const data =
        await response.json();

    if (!data.ok) {

        alert(data.error);

        return;

    }

    document.getElementById("editID")
        .value = data.id;

    document.getElementById("name")
        .value = data.name;

    document.getElementById("source")
        .value = data.source;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

async function deleteScript(id) {

    if (
        !confirm(
            "Delete this script?"
        )
    ) {
        return;
    }

    await fetch(
        "/api/delete/" +
        encodeURIComponent(id),
        {
            method: "DELETE"
        }
    );

    loadScripts();

}

async function loadScripts() {

    const box =
        document.getElementById("scripts");

    box.innerHTML = "Loading...";

    try {

        const response =
            await fetch("/api/scripts");

        const data =
            await response.json();

        if (!data.ok) {

            box.innerHTML =
                escapeHTML(
                    data.error
                );

            return;

        }

        if (!data.scripts.length) {

            box.innerHTML =
                "No scripts.";

            return;

        }

        box.innerHTML = "";

        data.scripts.forEach(script => {

            const div =
                document.createElement("div");

            div.className =
                "script";

            div.innerHTML = `

<strong>
    ${escapeHTML(script.name)}
</strong>

<div class="id">
    ID: ${escapeHTML(script.id)}
</div>

<button
    class="primary"
    onclick='copyText(${JSON.stringify(script.layer1)})'
>
COPY LOADER
</button>

<button
    onclick='copyText(${JSON.stringify(script.layer2)})'
>
COPY LAYER 2
</button>

<button
    onclick='editScript(${JSON.stringify(script.id)})'
>
EDIT
</button>

<button
    class="danger"
    onclick='deleteScript(${JSON.stringify(script.id)})'
>
DELETE
</button>

<details>
<summary>
LAYER 1
</summary>

<pre>${escapeHTML(script.layer1)}</pre>

</details>

<details>
<summary>
LAYER 2
</summary>

<pre>${escapeHTML(script.layer2)}</pre>

</details>

`;

            box.appendChild(div);

        });

    } catch (error) {

        box.innerHTML =
            "Failed to load scripts.";

        console.error(error);

    }

}

function clearEditor() {

    document.getElementById("name")
        .value = "";

    document.getElementById("source")
        .value = "";

    document.getElementById("editID")
        .value = "";

}

loadScripts();

</script>

</body>

</html>
