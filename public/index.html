<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEXINX Protect</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#070707;
    color:#eee;
    font-family:Arial,sans-serif;
}

.wrap{
    width:min(1100px,94%);
    margin:35px auto;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:20px;
    margin-bottom:15px;
}

h1,h2{
    margin-top:0;
}

input,textarea{
    width:100%;
    background:#050505;
    color:#eee;
    border:1px solid #333;
    border-radius:8px;
    outline:0;
    padding:12px;
    font:14px Consolas,monospace;
}

input:focus,
textarea:focus{
    border-color:#777;
}

input{
    margin-bottom:10px;
}

textarea{
    min-height:300px;
    resize:vertical;
}

button{
    background:#eee;
    color:#111;
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-weight:bold;
    cursor:pointer;
    margin:4px;
}

button.secondary{
    background:#222;
    color:#eee;
    border:1px solid #333;
}

button.danger{
    background:#421818;
    color:#ff9999;
}

button:hover{
    opacity:.82;
}

.hidden{
    display:none!important;
}

.status{
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:8px;
    padding:12px;
    margin-top:12px;
    white-space:pre-wrap;
    color:#aaa;
}

.ok{
    color:#7dff91;
}

.err{
    color:#ff7070;
}

.account-url{
    color:#888;
    word-break:break-all;
}

.script{
    border:1px solid #292929;
    background:#0b0b0b;
    border-radius:10px;
    padding:14px;
    margin:10px 0;
}

.script-name{
    font-weight:bold;
    margin-bottom:7px;
}

.loader{
    width:100%;
    background:#050505;
    color:#bbb;
    border:1px solid #292929;
    border-radius:7px;
    padding:10px;
    font:12px Consolas,monospace;
    word-break:break-all;
}

.row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.small{
    color:#777;
    font-size:12px;
}

@media(max-width:700px){
    .wrap{
        width:96%;
        margin:15px auto;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <!-- AUTH -->

    <section id="auth">

        <div class="card">

            <h1>LEXINX Protect</h1>

            <p class="small">
                Create an account or login.
            </p>

            <input
                id="username"
                autocomplete="username"
                placeholder="Username"
            >

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Password"
            >

            <div class="row">

                <button onclick="register()">
                    CREATE ACCOUNT
                </button>

                <button
                    class="secondary"
                    onclick="login()"
                >
                    LOGIN
                </button>

            </div>

            <div
                id="authStatus"
                class="status"
            >
                Ready.
            </div>

        </div>

    </section>


    <!-- DASHBOARD -->

    <section
        id="dashboard"
        class="hidden"
    >

        <div class="card">

            <div class="row">

                <div style="flex:1">

                    <h1>
                        LEXINX Dashboard
                    </h1>

                    <div>
                        Account:
                        <b id="accountName">
                            -
                        </b>
                    </div>

                    <div
                        id="accountURL"
                        class="account-url"
                    >
                        -
                    </div>

                </div>

                <div>

                    <button
                        class="secondary"
                        onclick="logout()"
                    >
                        LOGOUT
                    </button>

                </div>

            </div>

        </div>


        <!-- CREATE -->

        <div class="card">

            <h2>
                Upload / Create Script
            </h2>

            <input
                id="scriptName"
                placeholder="Script name"
            >

            <textarea
                id="scriptSource"
                spellcheck="false"
                placeholder="Paste Lua / Luau source..."
            ></textarea>

            <button onclick="createScript()">
                CREATE SCRIPT
            </button>

            <div
                id="createStatus"
                class="status"
            >
                Ready.
            </div>

        </div>


        <!-- SCRIPTS -->

        <div class="card">

            <div class="row">

                <h2 style="flex:1">
                    My Scripts
                </h2>

                <button
                    class="secondary"
                    onclick="loadScripts()"
                >
                    REFRESH
                </button>

            </div>

            <div id="scripts">
                Loading...
            </div>

        </div>

    </section>

</div>


<script>

/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
    document.getElementById(id);

function setStatus(
    element,
    message,
    ok = false
){

    element.className =
        "status " +
        (ok ? "ok" : "err");

    element.textContent =
        message;
}

async function api(
    url,
    options = {}
){

    try{

        const response =
            await fetch(
                url,
                {
                    credentials:"same-origin",
                    ...options,
                    headers:{
                        "Content-Type":
                            "application/json",
                        ...(options.headers || {})
                    }
                }
            );

        const text =
            await response.text();

        let data;

        try{
            data =
                text
                ? JSON.parse(text)
                : {};
        }catch{

            throw new Error(
                "Server returned invalid response: " +
                text.slice(0,200)
            );
        }

        if(!response.ok){

            throw new Error(
                data.error ||
                `HTTP ${response.status}`
            );
        }

        return data;

    }catch(error){

        if(
            error instanceof TypeError
        ){

            throw new Error(
                "Request failed. " +
                "Kiểm tra Render/server hoặc endpoint."
            );
        }

        throw error;
    }
}


/* =====================================================
   AUTH STATE
===================================================== */

function showDashboard(data){

    $("auth")
        .classList
        .add("hidden");

    $("dashboard")
        .classList
        .remove("hidden");

    $("accountName")
        .textContent =
        data.username || "-";

    $("accountURL")
        .textContent =
        data.url || "-";

    loadScripts();
}

function showAuth(){

    $("dashboard")
        .classList
        .add("hidden");

    $("auth")
        .classList
        .remove("hidden");
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

    const username =
        $("username")
        .value
        .trim();

    const password =
        $("password")
        .value;

    const status =
        $("authStatus");

    if(!username){

        setStatus(
            status,
            "Enter username."
        );

        return;
    }

    if(password.length < 6){

        setStatus(
            status,
            "Password must contain at least 6 characters."
        );

        return;
    }

    status.className =
        "status";

    status.textContent =
        "Creating account...";

    try{

        const data =
            await api(
                "/api/register",
                {
                    method:"POST",
                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );

        if(!data.ok){

            throw new Error(
                data.error ||
                "Registration failed"
            );
        }

        setStatus(
            status,
            "Account created successfully.",
            true
        );

        showDashboard(data);

    }catch(error){

        setStatus(
            status,
            "REGISTER ERROR:\n" +
            error.message
        );
    }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const username =
        $("username")
        .value
        .trim();

    const password =
        $("password")
        .value;

    const status =
        $("authStatus");

    if(!username ||
       !password){

        setStatus(
            status,
            "Enter username and password."
        );

        return;
    }

    status.className =
        "status";

    status.textContent =
        "Logging in...";

    try{

        const data =
            await api(
                "/api/login",
                {
                    method:"POST",
                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );

        if(!data.ok){

            throw new Error(
                data.error ||
                "Login failed"
            );
        }

        setStatus(
            status,
            "Login successful.",
            true
        );

        showDashboard(data);

    }catch(error){

        setStatus(
            status,
            "LOGIN ERROR:\n" +
            error.message
        );
    }
}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

    try{

        const data =
            await api(
                "/api/me"
            );

        if(data.ok){
            showDashboard(data);
        }

    }catch{

        showAuth();
    }
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        await api(
            "/api/logout",
            {
                method:"POST"
            }
        );

    }catch{}

    showAuth();

    $("authStatus")
        .className =
        "status";

    $("authStatus")
        .textContent =
        "Logged out.";
}


/* =====================================================
   CREATE SCRIPT
===================================================== */

async function createScript(){

    const name =
        $("scriptName")
        .value
        .trim();

    const source =
        $("scriptSource")
        .value;

    const status =
        $("createStatus");

    if(!source.trim()){

        setStatus(
            status,
            "Script source is empty."
        );

        return;
    }

    status.className =
        "status";

    status.textContent =
        "Uploading...";

    try{

        const data =
            await api(
                "/api/create",
                {
                    method:"POST",
                    body:JSON.stringify({
                        name,
                        source
                    })
                }
            );

        if(!data.ok){

            throw new Error(
                data.error ||
                "Create failed"
            );
        }

        setStatus(
            status,
            "SCRIPT CREATED\n\n" +
            "ID: " +
            data.id +
            "\n\n" +
            "Endpoint:\n" +
            data.endpoint +
            "\n\n" +
            "Loader:\n" +
            data.loader,
            true
        );

        $("scriptName")
            .value = "";

        $("scriptSource")
            .value = "";

        loadScripts();

    }catch(error){

        setStatus(
            status,
            "CREATE ERROR:\n" +
            error.message
        );
    }
}


/* =====================================================
   LOAD SCRIPTS
===================================================== */

async function loadScripts(){

    const container =
        $("scripts");

    container.textContent =
        "Loading...";

    try{

        const data =
            await api(
                "/api/scripts"
            );

        if(
            !data.scripts ||
            !data.scripts.length
        ){

            container.innerHTML =
                '<div class="small">' +
                'No scripts yet.' +
                '</div>';

            return;
        }

        container.innerHTML =
            "";

        for(
            const script
            of data.scripts
        ){

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "script";

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "script-name";

            title.textContent =
                script.name;

            const id =
                document.createElement(
                    "div"
                );

            id.className =
                "small";

            id.textContent =
                "ID: " +
                script.id;

            const loader =
                document.createElement(
                    "div"
                );

            loader.className =
                "loader";

            loader.textContent =
                script.loader;

            const buttons =
                document.createElement(
                    "div"
                );

            buttons.className =
                "row";

            const copy =
                document.createElement(
                    "button"
                );

            copy.textContent =
                "COPY LOADER";

            copy.onclick =
                () =>
                    copyText(
                        script.loader
                    );

            const edit =
                document.createElement(
                    "button"
                );

            edit.className =
                "secondary";

            edit.textContent =
                "EDIT";

            edit.onclick =
                () =>
                    editScript(
                        script.id
                    );

            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "danger";

            del.textContent =
                "DELETE";

            del.onclick =
                () =>
                    deleteScript(
                        script.id
                    );

            buttons.appendChild(copy);
            buttons.appendChild(edit);
            buttons.appendChild(del);

            box.appendChild(title);
            box.appendChild(id);
            box.appendChild(loader);
            box.appendChild(buttons);

            container.appendChild(box);
        }

    }catch(error){

        container.textContent =
            "LOAD ERROR: " +
            error.message;
    }
}


/* =====================================================
   EDIT
===================================================== */

async function editScript(id){

    try{

        const data =
            await api(
                "/api/script/" +
                encodeURIComponent(id)
            );

        if(!data.ok){
            throw new Error(
                data.error
            );
        }

        const script =
            data.script;

        const name =
            prompt(
                "Script name:",
                script.name
            );

        if(name === null)
            return;

        const source =
            prompt(
                "Lua source:",
                script.source
            );

        if(source === null)
            return;

        await api(
            "/api/edit/" +
            encodeURIComponent(id),
            {
                method:"POST",
                body:JSON.stringify({
                    name,
                    source
                })
            }
        );

        loadScripts();

    }catch(error){

        alert(
            "EDIT ERROR:\n" +
            error.message
        );
    }
}


/* =====================================================
   DELETE
===================================================== */

async function deleteScript(id){

    if(
        !confirm(
            "Delete this script?"
        )
    ){
        return;
    }

    try{

        await api(
            "/api/delete/" +
            encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );

        loadScripts();

    }catch(error){

        alert(
            "DELETE ERROR:\n" +
            error.message
        );
    }
}


/* =====================================================
   COPY
===================================================== */

async function copyText(text){

    try{

        await navigator.clipboard
            .writeText(text);

        alert(
            "Loader copied."
        );

    }catch{

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            text;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        alert(
            "Loader copied."
        );
    }
}


/* =====================================================
   START
===================================================== */

checkSession();

</script>

</body>
</html>
