<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #181818,
            #050505 55%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container {
    width: min(950px, 94%);
    margin: 35px auto 80px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;

    font-size: 34px;
    letter-spacing: 5px;
}

.header p {
    color: #777;
    margin-top: 8px;
}

.card {
    background: rgba(15, 15, 15, .95);

    border: 1px solid #292929;

    border-radius: 16px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);
}

.card h2 {
    margin-top: 0;
}

input[type="text"],
input[type="file"],
textarea {

    width: 100%;

    background: #050505;

    color: #ddd;

    border: 1px solid #333;

    border-radius: 10px;

    padding: 12px;

    outline: none;
}

input[type="text"] {
    margin-bottom: 12px;
}

input:focus,
textarea:focus {
    border-color: #666;
}

textarea {
    min-height: 320px;

    resize: vertical;

    font-family:
        Consolas,
        monospace;

    line-height: 1.5;

    margin-top: 12px;
}

input[type="file"] {
    margin-bottom: 5px;
}

button {
    border: 0;

    border-radius: 9px;

    padding: 11px 16px;

    cursor: pointer;

    background: white;

    color: black;

    font-weight: bold;

    transition: .15s;
}

button:hover {
    transform: translateY(-1px);
    opacity: .85;
}

.primary {
    margin-top: 12px;
}

.status {
    margin-top: 12px;

    color: #888;

    min-height: 20px;

    font-family: monospace;
}

/* SCRIPT */

.script {
    background: #080808;

    border: 1px solid #292929;

    border-radius: 13px;

    padding: 17px;

    margin-top: 13px;
}

.script-name {
    font-weight: bold;

    font-size: 17px;

    margin-bottom: 5px;
}

.script-id {
    color: #666;

    font-family: monospace;

    font-size: 11px;
}

/* FULL LOADER */

.loader-label {
    margin-top: 14px;

    color: #777;

    font-size: 12px;
}

.loader-row {
    display: flex;

    gap: 8px;

    margin-top: 7px;
}

.loader-input {
    flex: 1;

    min-width: 0;

    background: #000;

    color: #aaa;

    border: 1px solid #333;

    border-radius: 8px;

    padding: 12px;

    font-family: monospace;

    font-size: 12px;
}

.copy-loader {
    white-space: nowrap;
}

.actions {
    display: flex;

    gap: 8px;

    margin-top: 12px;

    flex-wrap: wrap;
}

.delete {
    background: #252525;

    color: white;
}

.empty {
    color: #666;

    text-align: center;

    padding: 25px;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>LEXINX PROTECT</h1>

        <p>
            Lua Script Protection & Loader Generator
        </p>

    </div>


    <!-- CREATE -->

    <div class="card">

        <h2>Create Loader</h2>

        <input
            id="name"
            type="text"
            placeholder="Script name"
        >

        <input
            id="file"
            type="file"
            accept=".lua,.txt"
        >

        <textarea
            id="code"
            placeholder="Paste your Lua script here..."
        ></textarea>

        <button
            class="primary"
            onclick="createScript()"
        >
            Create Protected Loader
        </button>

        <div
            id="status"
            class="status"
        ></div>

    </div>


    <!-- LIST -->

    <div class="card">

        <h2>Script List</h2>

        <div id="scripts">
            Loading...
        </div>

    </div>

</div>


<script>

/* =========================
   CREATE
========================= */

async function createScript() {

    const status =
        document.getElementById(
            "status"
        );

    const name =
        document.getElementById(
            "name"
        ).value.trim()
        || "Script";

    const file =
        document.getElementById(
            "file"
        ).files[0];

    let code =
        document.getElementById(
            "code"
        ).value;

    try {

        /*
        Nếu có file:
        đọc trực tiếp thành text.
        */

        if (file) {

            const lower =
                file.name.toLowerCase();

            if (
                !lower.endsWith(".lua") &&
                !lower.endsWith(".txt")
            ) {
                throw new Error(
                    "Only .lua and .txt files are supported"
                );
            }

            code =
                await file.text();
        }

        if (!code.trim()) {
            throw new Error(
                "Script is empty"
            );
        }

        status.textContent =
            "Creating loader...";

        const response =
            await fetch(
                "/api/create",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name:
                                file
                                    ? file.name
                                    : name,

                            code
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Server error"
            );
        }

        status.textContent =
            "Loader created: " +
            data.id;

        document.getElementById(
            "code"
        ).value = "";

        document.getElementById(
            "file"
        ).value = "";

        await loadScripts();

    } catch (error) {

        status.textContent =
            "Error: " +
            error.message;
    }
}


/* =========================
   LOAD SCRIPTS
========================= */

async function loadScripts() {

    const box =
        document.getElementById(
            "scripts"
        );

    try {

        const response =
            await fetch(
                "/api/scripts",
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (
            !data.ok ||
            data.scripts.length === 0
        ) {

            box.innerHTML =
                `<div class="empty">
                    No scripts created yet.
                </div>`;

            return;
        }

        box.innerHTML = "";

        for (
            const script
            of data.scripts
        ) {

            /*
            FULL LOADER
            */

            const loader =
                `loadstring(game:HttpGet("${location.origin}/api/${script.id}"))()`;

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "script";

            /* NAME */

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "script-name";

            name.textContent =
                script.name;

            /* ID */

            const id =
                document.createElement(
                    "div"
                );

            id.className =
                "script-id";

            id.textContent =
                "ID: " + script.id;

            /* LABEL */

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "loader-label";

            label.textContent =
                "FULL LOADER";

            /* LOADER ROW */

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "loader-row";

            /* INPUT */

            const input =
                document.createElement(
                    "input"
                );

            input.className =
                "loader-input";

            input.value =
                loader;

            input.readOnly = true;

            /* COPY */

            const copy =
                document.createElement(
                    "button"
                );

            copy.className =
                "copy-loader";

            copy.textContent =
                "Copy Full Loader";

            copy.onclick =
                async () => {

                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                loader
                            );

                    } catch {

                        input.focus();

                        input.select();

                        document.execCommand(
                            "copy"
                        );
                    }

                    copy.textContent =
                        "Copied!";

                    setTimeout(
                        () => {
                            copy.textContent =
                                "Copy Full Loader";
                        },
                        1500
                    );
                };

            row.appendChild(input);
            row.appendChild(copy);

            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "actions";

            const open =
                document.createElement(
                    "button"
                );

            open.textContent =
                "Open Payload URL";

            open.onclick =
                () => {
                    window.open(
                        `/api/${script.id}`,
                        "_blank"
                    );
                };

            const del =
                document.createElement(
                    "button"
                );

            del.className =
                "delete";

            del.textContent =
                "Delete";

            del.onclick =
                async () => {

                    const confirmDelete =
                        confirm(
                            `Delete "${script.name}"?`
                        );

                    if (!confirmDelete) {
                        return;
                    }

                    const response =
                        await fetch(
                            `/api/scripts/${encodeURIComponent(script.id)}`,
                            {
                                method:
                                    "DELETE"
                            }
                        );

                    if (response.ok) {
                        loadScripts();
                    }
                };

            actions.appendChild(open);
            actions.appendChild(del);

            /* BUILD */

            div.appendChild(name);
            div.appendChild(id);
            div.appendChild(label);
            div.appendChild(row);
            div.appendChild(actions);

            box.appendChild(div);
        }

    } catch (error) {

        box.innerHTML =
            `<div class="empty">
                Failed to load scripts.
            </div>`;

        console.error(error);
    }
}


/* =========================
   START
========================= */

loadScripts();

</script>

</body>

</html>
