<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXINX PROTECT - Script Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #ff4444;
            --accent-hover: #ff6666;
            --success: #44ff44;
            --warning: #ffff44;
            --danger: #ff4444;
            --border: #3a3a3a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-bottom: 2px solid var(--accent);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff4444, #ff8888, #ff4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite;
        }

        @keyframes gradient {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(360deg); }
        }

        .header .subtitle {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
        }

        /* Auth Forms */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: var(--bg-card);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.2);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        .toggle-auth a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .toggle-auth a:hover {
            text-decoration: underline;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .user-details h3 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .user-details p {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-permanent {
            background: #ff4444;
            color: white;
        }

        .badge-one-time {
            background: #ff8800;
            color: white;
        }

        /* Script List */
        .scripts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .script-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .script-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
        }

        .script-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .script-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .script-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .script-date {
            color: var(--text-secondary);
            font-size: 0.8em;
        }

        .script-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .script-actions button {
            flex: 1;
            padding: 8px;
            font-size: 0.9em;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--accent);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
        }

        .modal-close:hover {
            color: var(--accent);
        }

        textarea {
            width: 100%;
            min-height: 300px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-primary);
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.2);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            z-index: 2000;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }

        .notification-success {
            background: #28a745;
        }

        .notification-error {
            background: #dc3545;
        }

        .notification-info {
            background: #007bff;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .scripts-container {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .modal-content {
                padding: 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ LEXINX PROTECT</h1>
        <p class="subtitle">Ultimate Script Protection System</p>
    </div>

    <div class="container">
        <!-- Auth Forms -->
        <div class="auth-container" id="authContainer">
            <h2 id="authTitle">Đăng Nhập</h2>
            
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
            </div>
            
            <div class="form-group" id="codeGroup" style="display: none;">
                <label for="code">Mã truy cập</label>
                <input type="text" id="code" placeholder="Nhập mã truy cập">
            </div>
            
            <button class="btn" id="authButton" onclick="handleAuth()">Đăng Nhập</button>
            
            <div class="toggle-auth">
                <span id="toggleText">Chưa có tài khoản?</span>
                <a id="toggleAuth" onclick="toggleAuthMode()">Đăng ký</a>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <div class="dashboard-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div class="user-details">
                        <h3 id="userName">Username</h3>
                        <p>
                            <span class="badge" id="accessBadge">Access Type</span>
                            <span id="scriptCount" style="margin-left: 10px;">0 scripts</span>
                        </p>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="showCreateScript()" style="width: auto; padding: 10px 20px;">
                        ➕ Tạo Script
                    </button>
                    <button class="btn btn-danger" onclick="handleLogout()" style="width: auto; padding: 10px 20px;">
                        🚪 Đăng xuất
                    </button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="scripts-container" id="scriptsContainer"></div>
        </div>
    </div>

    <!-- Create/Edit Script Modal -->
    <div class="modal" id="scriptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tạo Script Mới</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            
            <div class="form-group">
                <label for="scriptName">Tên Script</label>
                <input type="text" id="scriptName" placeholder="Nhập tên script">
            </div>
            
            <div class="form-group">
                <label for="scriptSource">Source Code (Lua)</label>
                <textarea id="scriptSource" placeholder="-- Nhập code Lua của bạn ở đây"></textarea>
            </div>
            
            <button class="btn" id="saveScriptBtn" onclick="saveScript()">Lưu Script</button>
        </div>
    </div>

    <!-- View Script Modal -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="viewModalTitle">Thông tin Script</h2>
                <button class="modal-close" onclick="closeViewModal()">✕</button>
            </div>
            
            <div id="viewContent"></div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let currentScripts = [];
        let editingScriptId = null;

        // API Base URL
        const API_BASE = '';

        // Notification System
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Toggle Auth Mode
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            
            if (isLoginMode) {
                document.getElementById('authTitle').textContent = 'Đăng Nhập';
                document.getElementById('authButton').textContent = 'Đăng Nhập';
                document.getElementById('toggleText').textContent = 'Chưa có tài khoản?';
                document.getElementById('toggleAuth').textContent = 'Đăng ký';
                document.getElementById('codeGroup').style.display = 'none';
            } else {
                document.getElementById('authTitle').textContent = 'Đăng Ký';
                document.getElementById('authButton').textContent = 'Đăng Ký';
                document.getElementById('toggleText').textContent = 'Đã có tài khoản?';
                document.getElementById('toggleAuth').textContent = 'Đăng nhập';
                document.getElementById('codeGroup').style.display = 'block';
            }
        }

        // Handle Authentication
        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const code = document.getElementById('code').value.trim();
            
            if (!username || !password) {
                showNotification('Vui lòng nhập đầy đủ thông tin!', 'error');
                return;
            }
            
            if (!isLoginMode && !code) {
                showNotification('Vui lòng nhập mã truy cập!', 'error');
                return;
            }
            
            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            const data = isLoginMode ? { username, password } : { username, password, code };
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    showNotification(isLoginMode ? 'Đăng nhập thành công!' : 'Đăng ký thành công!', 'success');
                    loadDashboard();
                } else {
                    showNotification(result.error || 'Có lỗi xảy ra!', 'error');
                }
            } catch (error) {
                showNotification('Lỗi kết nối!', 'error');
            }
        }

        // Load Dashboard
        async function loadDashboard() {
            try {
                const response = await fetch('/api/me');
                const result = await response.json();
                
                if (result.ok) {
                    document.getElementById('authContainer').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    
                    document.getElementById('userName').textContent = result.username;
                    document.getElementById('userAvatar').textContent = result.username.charAt(0).toUpperCase();
                    
                    const badge = document.getElementById('accessBadge');
                    badge.textContent = result.accessType;
                    badge.className = `badge badge-${result.accessType}`;
                    
                    document.getElementById('scriptCount').textContent = `${result.scriptCount} scripts`;
                    
                    loadScripts();
                } else {
                    showNotification('Vui lòng đăng nhập!', 'error');
                }
            } catch (error) {
                showNotification('Lỗi kết nối!', 'error');
            }
        }

        // Load Scripts
        async function loadScripts() {
            const loading = document.getElementById('loading');
            loading.classList.add('active');
            
            try {
                const response = await fetch('/api/scripts');
                const result = await response.json();
                
                if (result.ok) {
                    currentScripts = result.scripts;
                    renderScripts(currentScripts);
                } else {
                    showNotification('Lỗi tải scripts!', 'error');
                }
            } catch (error) {
                showNotification('Lỗi kết nối!', 'error');
            } finally {
                loading.classList.remove('active');
            }
        }

        // Render Scripts
        function renderScripts(scripts) {
            const container = document.getElementById('scriptsContainer');
            
            if (scripts.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
                        <p style="color: var(--text-secondary); font-size: 1.2em;">📦 Chưa có script nào</p>
                        <p style="color: var(--text-secondary); margin-top: 10px;">Nhấn "Tạo Script" để bắt đầu</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = scripts.map(script => `
                <div class="script-card">
                    <div class="script-card-header">
                        <div>
                            <div class="script-name">${script.name}</div>
                            <div class="script-date">${new Date(script.createdAt).toLocaleDateString('vi-VN')}</div>
                        </div>
                        <span class="badge badge-permanent">🔒 Protected</span>
                    </div>
                    
                    <div class="script-actions">
                        <button class="btn btn-secondary" onclick="viewScript('${script.id}')">👁️ Xem</button>
                        <button class="btn btn-secondary" onclick="editScript('${script.id}')">✏️ Sửa</button>
                        <button class="btn btn-danger" onclick="deleteScript('${script.id}')">🗑️ Xóa</button>
                    </div>
                </div>
            `).join('');
        }

        // Show Create Script Modal
        function showCreateScript() {
            editingScriptId = null;
            document.getElementById('modalTitle').textContent = 'Tạo Script Mới';
            document.getElementById('scriptName').value = '';
            document.getElementById('scriptSource').value = '';
            document.getElementById('scriptModal').classList.add('active');
        }

        // Edit Script
        async function editScript(id) {
            try {
                const response = await fetch(`/api/scripts/${id}`);
                const result = await response.json();
                
                if (result.ok) {
                    editingScriptId = id;
                    document.getElementById('modalTitle').textContent = 'Sửa Script';
                    document.getElementById('scriptName').value = result.script.name;
                    document.getElementById('scriptSource').value = result.script.source;
                    document.getElementById('scriptModal').classList.add('active');
                } else {
                    showNotification('Lỗi tải script!', 'error');
                }
            } catch (error) {
                showNotification('Lỗi kết nối!', 'error');
            }
        }

        // View Script
        function viewScript(id) {
            const script = currentScripts.find(s => s.id === id);
            
            if (!script) {
                showNotification('Script không tồn tại!', 'error');
                return;
            }
            
            document.getElementById('viewModalTitle').textContent = script.name;
            document.getElementById('viewContent').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 10px;">📌 Endpoint:</h3>
                    <div style="background: var(--bg-primary); padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                        <code style="color: var(--accent); word-break: break-all;">${script.endpoint}</code>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 10px;">🚀 Loader Script:</h3>
                    <div style="background: var(--bg-primary); padding: 15px; border-radius: 5px; margin-bottom: 10px;">
                        <code style="color: #44ff44; word-break: break-all;">${script.loader}</code>
                    </div>
                    <button class="btn btn-secondary" onclick="copyToClipboard('${script.loader}')">
                        📋 Copy Loader
                    </button>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="margin-bottom: 10px;">ℹ️ Thông tin:</h3>
                    <p><strong>Tạo lúc:</strong> ${new Date(script.createdAt).toLocaleString('vi-VN')}</p>
                    <p><strong>Cập nhật:</strong> ${new Date(script.updatedAt).toLocaleString('vi-VN')}</p>
                </div>
            `;
            
            document.getElementById('viewModal').classList.add('active');
        }

        // Copy to Clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Đã copy vào clipboard!', 'success');
            }).catch(() => {
                showNotification('Không thể copy!', 'error');
            });
        }

        // Save Script
        async function saveScript() {
            const name = document.getElementById('scriptName').value.trim();
            const source = document.getElementById('scriptSource').value;
            
            if (!name || !source) {
                showNotification('Vui lòng nhập đầy đủ thông tin!', 'error');
                return;
            }
            
            const endpoint = editingScriptId ? `/api/scripts/${editingScriptId}` : '/api/create';
            const method = editingScriptId ? 'PUT' : 'POST';
            
            try {
                const response = await fetch(endpoint, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, source })
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    showNotification(editingScriptId ? 'Cập nhật thành công!' : 'Tạo script thành công!', 'success');
                    closeModal();
                    loadScripts();
                } else {
                    showNotification(result.error || 'Có lỗi xảy ra!', 'error');
                }
            } catch (error) {
                showNotification('Lỗi kết nối!', 'error');
            }
        }

        // Delete Script
        async function deleteScript(id) {
            if (!confirm('Bạn có chắc muốn xóa script này?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/scripts/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    showNotification('Xóa script thành công!', 'success');
                    loadScripts();
                } else {
                    showNotification('Lỗi xóa script!', 'error');
                }
            } catch (error) {
                showNotification('Lỗi kết nối!', 'error');
            }
        }

        // Close Modals
        function closeModal() {
            document.getElementById('scriptModal').classList.remove('active');
            editingScriptId = null;
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('active');
        }

        // Handle Logout
        async function handleLogout() {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    showNotification('Đăng xuất thành công!', 'success');
                    document.getElementById('dashboard').style.display = 'none';
                    document.getElementById('authContainer').style.display = 'block';
                    
                    // Reset form
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('code').value = '';
                }
            } catch (error) {
                showNotification('Lỗi kết nối!', 'error');
            }
        }

        // Auto-load dashboard on page load
        window.addEventListener('load', () => {
            loadDashboard();
        });

        // Enter key to submit form
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('authContainer').style.display !== 'none') {
                handleAuth();
            }
        });
    </script>
</body>
</html>
