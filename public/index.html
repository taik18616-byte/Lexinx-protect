<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEXINX Protect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                #080808;
            color: #fff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .hidden {
            display: none !important;
        }

        .center {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 28px;
            box-shadow:
                0 20px 70px
                rgba(0,0,0,.5);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .sub {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }

        input,
        textarea {
            width: 100%;
            background: #080808;
            color: #fff;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 12px;
            outline: none;
            margin-bottom: 12px;
        }

        input:focus,
        textarea:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            background: #fff;
            color: #000;
            font-weight: 700;
            margin-top: 5px;
        }

        button.secondary {
            background: #1b1b1b;
            color: #fff;
            border: 1px solid #303030;
        }

        .switch {
            text-align: center;
            color: #888;
            margin-top: 18px;
            cursor: pointer;
        }

        .switch span {
            color: #fff;
            font-weight: 700;
        }

        .error {
            color: #ff6666;
            margin: 10px 0;
            text-align: center;
        }

        .success {
            color: #65e89b;
            margin: 10px 0;
            text-align: center;
        }

        /* DASHBOARD */

        .dashboard {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
        }

        .user {
            color: #aaa;
        }

        .logout {
            width: auto;
            padding: 9px 15px;
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
        }

        .grid {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 20px;
        }

        .panel h2 {
            margin-top: 0;
        }

        textarea {
            min-height: 350px;
            resize: vertical;
            font-family:
                monospace;
        }

        .scripts {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .script {
            background: #080808;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 12px;
        }

        .script-name {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .script-id {
            color: #777;
            font-size: 12px;
            word-break: break-all;
        }

        .script-actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .script-actions button {
            margin: 0;
            padding: 8px;
        }

        .delete {
            background: #321414 !important;
            color: #ff8585 !important;
            border: 1px solid #552020 !important;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 30px 0;
        }

        .loader-output {
            margin-top: 12px;
            display: none;
        }

        .loader-output textarea {
            min-height: 90px;
        }

        @media (
            max-width: 800px
        ) {
            .grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- ==================================================
     AUTH
================================================== -->

<div id="auth" class="center">

    <div class="card">

        <div class="logo">
            LEXINX
        </div>

        <div class="sub">
            Protect Dashboard
        </div>

        <div id="loginBox">

            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                onclick="login()"
            >
                Đăng nhập
            </button>

            <div
                id="loginMessage"
                class="error"
            ></div>

            <div
                class="switch"
                onclick="showRegister()"
            >
                Chưa có tài khoản?
                <span>Đăng ký</span>
            </div>

        </div>

        <div
            id="registerBox"
            class="hidden"
        >

            <input
                id="registerUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <input
                id="registerPassword2"
                type="password"
                placeholder="Nhập lại password"
                autocomplete="new-password"
            >

            <button
                onclick="register()"
            >
                Tạo tài khoản
            </button>

            <div
                id="registerMessage"
                class="error"
            ></div>

            <div
                class="switch"
                onclick="showLogin()"
            >
                Đã có tài khoản?
                <span>Đăng nhập</span>
            </div>

        </div>

    </div>

</div>

<!-- ==================================================
     DASHBOARD
================================================== -->

<div
    id="dashboard"
    class="dashboard hidden"
>

    <div class="topbar">

        <div>
            <div class="brand">
                LEXINX Protect
            </div>

            <div class="user">
                Tài khoản:
                <strong id="currentUser">
                    -
                </strong>
            </div>
        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Đăng xuất
        </button>

    </div>

    <div class="grid">

        <!-- CREATE / EDIT -->

        <div class="panel">

            <h2>
                Script Editor
            </h2>

            <input
                id="scriptName"
                placeholder="Tên script"
            >

            <textarea
                id="scriptSource"
                placeholder="Dán Lua source vào đây..."
            ></textarea>

            <button
                onclick="saveScript()"
            >
                Tạo Script
            </button>

            <button
                class="secondary"
                onclick="clearEditor()"
            >
                Xóa Editor
            </button>

            <div
                id="editorMessage"
                class="success"
            ></div>

            <div
                id="loaderOutput"
                class="loader-output"
            >
                <textarea
                    id="loaderText"
                    readonly
                ></textarea>

                <button
                    class="secondary"
                    onclick="copyLoader()"
                >
                    Copy Loader
                </button>
            </div>

        </div>

        <!-- SCRIPT LIST -->

        <div class="panel">

            <h2>
                Script của tôi
            </h2>

            <div
                id="scripts"
                class="scripts"
            >
                <div class="empty">
                    Đang tải...
                </div>
            </div>

        </div>

    </div>

</div>

<script>
    let editingID = null;

    /* =================================================
       API
    ================================================= */

    async function api(
        url,
        options = {}
    ) {
        const response =
            await fetch(
                url,
                {
                    credentials:
                        "same-origin",
                    ...options,
                    headers: {
                        "Content-Type":
                            "application/json",
                        ...(options.headers || {})
                    }
                }
            );

        let data = {};

        try {
            data =
                await response.json();
        } catch {}

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Request failed"
            );
        }

        return data;
    }

    /* =================================================
       AUTH UI
    ================================================= */

    function showRegister() {
        document
            .getElementById(
                "loginBox"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "registerBox"
            )
            .classList
            .remove("hidden");
    }

    function showLogin() {
        document
            .getElementById(
                "registerBox"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "loginBox"
            )
            .classList
            .remove("hidden");
    }

    /* =================================================
       REGISTER
    ================================================= */

    async function register() {

        const username =
            document
                .getElementById(
                    "registerUsername"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;

        const password2 =
            document
                .getElementById(
                    "registerPassword2"
                )
                .value;

        const message =
            document
                .getElementById(
                    "registerMessage"
                );

        message.textContent = "";

        if (
            password !==
            password2
        ) {
            message.textContent =
                "Password không giống nhau";
            return;
        }

        try {

            const data =
                await api(
                    "/api/register",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );

            message.textContent =
                "Tạo tài khoản thành công";

            enterDashboard(
                data.username
            );

        } catch (error) {

            message.textContent =
                error.message;
        }
    }

    /* =================================================
       LOGIN
    ================================================= */

    async function login() {

        const username =
            document
                .getElementById(
                    "loginUsername"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;

        const message =
            document
                .getElementById(
                    "loginMessage"
                );

        message.textContent = "";

        try {

            const data =
                await api(
                    "/api/login",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );

            enterDashboard(
                data.username
            );

        } catch (error) {

            message.textContent =
                error.message;
        }
    }

    /* =================================================
       LOGOUT
    ================================================= */

    async function logout() {

        try {
            await api(
                "/api/logout",
                {
                    method: "POST"
                }
            );
        } catch {}

        document
            .getElementById(
                "dashboard"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "auth"
            )
            .classList
            .remove("hidden");

        showLogin();
    }

    /* =================================================
       DASHBOARD
    ================================================= */

    function enterDashboard(
        username
    ) {

        document
            .getElementById(
                "auth"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "dashboard"
            )
            .classList
            .remove("hidden");

        document
            .getElementById(
                "currentUser"
            )
            .textContent =
                username;

        loadScripts();
    }

    /* =================================================
       LOAD SCRIPTS
    ================================================= */

    async function loadScripts() {

        const container =
            document
                .getElementById(
                    "scripts"
                );

        try {

            const data =
                await api(
                    "/api/scripts"
                );

            if (
                !data.scripts.length
            ) {
                container.innerHTML =
                    '<div class="empty">Chưa có script</div>';
                return;
            }

            container.innerHTML =
                data.scripts
                    .map(
                        script => `
                            <div class="script">

                                <div class="script-name">
                                    ${escapeHTML(
                                        script.name
                                    )}
                                </div>

                                <div class="script-id">
                                    ID:
                                    ${escapeHTML(
                                        script.id
                                    )}
                                </div>

                                <div class="script-actions">

                                    <button
                                        onclick="editScript('${script.id}')"
                                    >
                                        Edit
                                    </button>

                                    <button
                                        onclick="copyText(${JSON.stringify(
                                            script.loader
                                        )})"
                                    >
                                        Copy Loader
                                    </button>

                                    <button
                                        class="delete"
                                        onclick="deleteScript('${script.id}')"
                                    >
                                        Delete
                                    </button>

                                </div>

                            </div>
                        `
                    )
                    .join("");

        } catch (error) {

            container.innerHTML =
                `<div class="error">${escapeHTML(
                    error.message
                )}</div>`;
        }
    }

    /* =================================================
       CREATE / EDIT
    ================================================= */

    async function saveScript() {

        const name =
            document
                .getElementById(
                    "scriptName"
                )
                .value
                .trim();

        const source =
            document
                .getElementById(
                    "scriptSource"
                )
                .value;

        const message =
            document
                .getElementById(
                    "editorMessage"
                );

        message.textContent = "";

        try {

            let data;

            if (editingID) {

                data =
                    await api(
                        "/api/edit/" +
                        editingID,
                        {
                            method:
                                "POST",

                            body:
                                JSON.stringify({
                                    name,
                                    source
                                })
                        }
                    );

                message.textContent =
                    "Đã cập nhật script";

            } else {

                data =
                    await api(
                        "/api/create",
                        {
                            method:
                                "POST",

                            body:
                                JSON.stringify({
                                    name,
                                    source
                                })
                        }
                    );

                message.textContent =
                    "Đã tạo script";

                document
                    .getElementById(
                        "loaderText"
                    )
                    .value =
                    data.loader;

                document
                    .getElementById(
                        "loaderOutput"
                    )
                    .style.display =
                        "block";
            }

            editingID = null;

            document
                .getElementById(
                    "scriptName"
                )
                .value = "";

            document
                .getElementById(
                    "scriptSource"
                )
                .value = "";

            loadScripts();

        } catch (error) {

            message.textContent =
                error.message;
        }
    }

    /* =================================================
       EDIT
    ================================================= */

    async function editScript(id) {

        try {

            const data =
                await api(
                    "/api/script/" +
                    id
                );

            editingID =
                id;

            document
                .getElementById(
                    "scriptName"
                )
                .value =
                data.script.name;

            document
                .getElementById(
                    "scriptSource"
                )
                .value =
                data.script.source;

            document
                .querySelector(
                    ".panel h2"
                )
                .textContent =
                "Edit Script";

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    /* =================================================
       DELETE
    ================================================= */

    async function deleteScript(
        id
    ) {

        if (
            !confirm(
                "Xóa script này?"
            )
        ) {
            return;
        }

        try {

            await api(
                "/api/delete/" +
                id,
                {
                    method:
                        "DELETE"
                }
            );

            loadScripts();

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    /* =================================================
       CLEAR
    ================================================= */

    function clearEditor() {

        editingID = null;

        document
            .getElementById(
                "scriptName"
            )
            .value = "";

        document
            .getElementById(
                "scriptSource"
            )
            .value = "";

        document
            .getElementById(
                "editorMessage"
            )
            .textContent = "";

        document
            .getElementById(
                "loaderOutput"
            )
            .style.display =
                "none";
    }

    /* =================================================
       COPY
    ================================================= */

    async function copyText(
        text
    ) {

        try {

            await navigator
                .clipboard
                .writeText(text);

            alert(
                "Đã copy"
            );

        } catch {

            prompt(
                "Copy:",
                text
            );
        }
    }

    async function copyLoader() {

        const text =
            document
                .getElementById(
                    "loaderText"
                )
                .value;

        copyText(text);
    }

    /* =================================================
       ESCAPE
    ================================================= */

    function escapeHTML(
        value
    ) {
        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

    /* =================================================
       CHECK SESSION
    ================================================= */

    async function checkLogin() {

        try {

            const data =
                await api(
                    "/api/me"
                );

            enterDashboard(
                data.username
            );

        } catch {
            // Chưa đăng nhập
        }
    }

    checkLogin();
</script>

</body>
</html>
