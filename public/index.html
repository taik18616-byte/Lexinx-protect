<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #181818,
            #050505 60%
        );

    color: white;

    font-family:
        Arial,
        sans-serif;
}

.container {
    width:
        min(950px, 94%);

    margin:
        45px auto;
}

.logo {
    text-align: center;

    font-size: 44px;

    font-weight: 900;

    letter-spacing: 3px;
}

.subtitle {
    text-align: center;

    color: #777;

    margin:
        10px 0 35px;
}

.card {
    background: #101010;

    border:
        1px solid #292929;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 25px;
}

.tabs {
    display: flex;

    gap: 10px;

    margin-bottom: 20px;
}

.tab {
    flex: 1;

    margin: 0;

    background: #181818;

    color: #aaa;

    border:
        1px solid #292929;
}

.tab.active {
    background: white;

    color: black;
}

input[type=file] {
    width: 100%;

    padding: 14px;

    background: #080808;

    border:
        1px solid #333;

    border-radius: 10px;

    color: #aaa;
}

textarea {
    width: 100%;

    height: 330px;

    resize: vertical;

    background: #050505;

    color: #ddd;

    border:
        1px solid #333;

    border-radius: 12px;

    padding: 15px;

    font-family:
        Consolas,
        monospace;

    font-size: 14px;

    outline: none;
}

textarea:focus {
    border-color: #666;
}

.name-input {
    width: 100%;

    padding: 13px;

    margin-bottom: 12px;

    background: #080808;

    color: white;

    border:
        1px solid #333;

    border-radius: 10px;
}

button {
    border: 0;

    border-radius: 9px;

    padding:
        11px 17px;

    margin-top: 12px;

    background: white;

    color: black;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    opacity: .82;
}

.status {
    margin-top: 15px;

    color: #888;
}

.script {
    background: #080808;

    border:
        1px solid #252525;

    border-radius: 12px;

    padding: 18px;

    margin-top: 14px;
}

.script-name {
    font-size: 18px;

    font-weight: bold;
}

.script-id {
    color: #666;

    font-size: 12px;

    margin-top: 5px;
}

.loader {
    margin-top: 12px;

    padding: 12px;

    background: #000;

    color: #999;

    border-radius: 8px;

    overflow-x: auto;

    white-space: nowrap;

    font-family: monospace;

    font-size: 12px;
}

.actions {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.delete {
    background: #222;

    color: white;
}

.empty {
    color: #666;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
LEXINX PROTECT
</div>

<div class="subtitle">
Lua / TXT Script Protection & Loader Manager
</div>

<div class="card">

<h2>Create Protected Script</h2>

<div class="tabs">

<button
    class="tab active"
    id="fileTab"
    onclick="switchTab('file')"
>
    Upload File
</button>

<button
    class="tab"
    id="codeTab"
    onclick="switchTab('code')"
>
    Write Script
</button>

</div>

<div id="fileMode">

<input
    id="file"
    type="file"
    accept=".lua,.txt"
>

</div>

<div
    id="codeMode"
    style="display:none;"
>

<input
    id="scriptName"
    class="name-input"
    type="text"
    placeholder="Script name, e.g. MyScript.lua"
>

<textarea
    id="code"
    placeholder="Write or paste your Lua script here..."
    spellcheck="false"
></textarea>

</div>

<button
    id="protectButton"
    onclick="protectScript()"
>
Protect Script
</button>

<div
    id="status"
    class="status"
></div>

</div>

<div class="card">

<h2>
Protected Scripts
</h2>

<div id="scripts">
Loading...
</div>

</div>

</div>

<script>

let mode = "file";

function switchTab(type) {

    mode = type;

    const fileMode =
        document.getElementById(
            "fileMode"
        );

    const codeMode =
        document.getElementById(
            "codeMode"
        );

    const fileTab =
        document.getElementById(
            "fileTab"
        );

    const codeTab =
        document.getElementById(
            "codeTab"
        );

    if (type === "file") {

        fileMode.style.display =
            "block";

        codeMode.style.display =
            "none";

        fileTab.classList.add(
            "active"
        );

        codeTab.classList.remove(
            "active"
        );

    } else {

        fileMode.style.display =
            "none";

        codeMode.style.display =
            "block";

        fileTab.classList.remove(
            "active"
        );

        codeTab.classList.add(
            "active"
        );
    }
}

async function protectScript() {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        "Processing...";

    try {

        if (mode === "file") {

            const file =
                document.getElementById(
                    "file"
                ).files[0];

            if (!file) {
                throw new Error(
                    "Please select a .lua or .txt file."
                );
            }

            const formData =
                new FormData();

            formData.append(
                "script",
                file
            );

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Upload failed"
                );
            }

            status.textContent =
                "Protected successfully: " +
                data.id;

            document.getElementById(
                "file"
            ).value = "";

        } else {

            const code =
                document.getElementById(
                    "code"
                ).value;

            const name =
                document.getElementById(
                    "scriptName"
                ).value.trim() ||
                "script.lua";

            if (!code.trim()) {
                throw new Error(
                    "Please enter a script."
                );
            }

            const response =
                await fetch(
                    "/api/create",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            code,
                            name
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Creation failed"
                );
            }

            status.textContent =
                "Protected successfully: " +
                data.id;

            document.getElementById(
                "code"
            ).value = "";

        }

        await loadScripts();

    } catch (error) {

        status.textContent =
            "ERROR: " +
            error.message;
    }
}

async function loadScripts() {

    const box =
        document.getElementById(
            "scripts"
        );

    try {

        const response =
            await fetch(
                "/api/scripts"
            );

        const data =
            await response.json();

        if (
            !data.ok ||
            !data.scripts.length
        ) {

            box.innerHTML =
                `<div class="empty">
                    No protected scripts.
                </div>`;

            return;
        }

        box.innerHTML = "";

        for (
            const script
            of data.scripts
        ) {

            const loader =
                `loadstring(game:HttpGet("${location.origin}/api/${script.id}"))()`;

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "script";

            item.innerHTML = `

                <div class="script-name">
                    ${escapeHTML(
                        script.name
                    )}
                </div>

                <div class="script-id">
                    ID:
                    ${escapeHTML(
                        script.id
                    )}
                </div>

                <div class="loader">
                    ${escapeHTML(
                        loader
                    )}
                </div>

                <div class="actions">

                    <button class="copy">
                        Copy Loader
                    </button>

                    <button class="delete">
                        Delete
                    </button>

                </div>
            `;

            item
                .querySelector(".copy")
                .onclick = async () => {

                    await navigator
                        .clipboard
                        .writeText(
                            loader
                        );

                    item
                        .querySelector(
                            ".copy"
                        )
                        .textContent =
                        "Copied!";
                };

            item
                .querySelector(".delete")
                .onclick = async () => {

                    if (
                        !confirm(
                            "Delete this script?"
                        )
                    ) {
                        return;
                    }

                    const result =
                        await fetch(
                            "/api/scripts/" +
                            encodeURIComponent(
                                script.id
                            ),
                            {
                                method:
                                    "DELETE"
                            }
                        );

                    if (result.ok) {
                        loadScripts();
                    }
                };

            box.appendChild(
                item
            );
        }

    } catch (error) {

        box.innerHTML =
            `<div class="empty">
                Failed to load scripts.
            </div>`;
    }
}

function escapeHTML(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}

loadScripts();

</script>

</body>

</html>
