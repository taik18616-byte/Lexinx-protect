<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LEXINX PROTECT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: min(900px, 94%);
    margin: 35px auto;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
}

h1 {
    margin-top: 0;
}

input,
textarea {
    width: 100%;
    background: #070707;
    color: #fff;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 11px;
    margin: 7px 0;
}

textarea {
    height: 300px;
    resize: vertical;
    font-family: monospace;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 5px 5px 5px 0;
    cursor: pointer;
    font-weight: bold;
}

.script {
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
}

.loader {
    margin-top: 10px;
    font-family: monospace;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>LEXINX PROTECT</h1>

<input
    id="name"
    placeholder="Script name">

<input
    id="file"
    type="file"
    accept=".lua,.txt">

<textarea
    id="source"
    placeholder="Paste Lua source here...">
</textarea>

<button onclick="createScript()">
Create Script
</button>

<p id="status"></p>

</div>

<div class="card">

<h2>Scripts</h2>

<div id="scripts">
Loading...
</div>

</div>

</div>

<script>

async function createScript() {

    const file =
        document.getElementById("file")
            .files[0];

    let source =
        document.getElementById("source")
            .value;

    if (file) {
        source = await file.text();
    }

    if (!source.trim()) {
        document.getElementById("status")
            .textContent =
            "Script is empty.";
        return;
    }

    const name =
        document.getElementById("name")
            .value ||
        file?.name ||
        "Script";

    const response =
        await fetch("/api/create", {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json"
            },
            body: JSON.stringify({
                name,
                source
            })
        });

    const data =
        await response.json();

    if (!data.ok) {
        document.getElementById("status")
            .textContent =
            data.error || "Error";
        return;
    }

    document.getElementById("status")
        .textContent =
        "Created: " + data.id;

    document.getElementById("source")
        .value = "";

    document.getElementById("file")
        .value = "";

    loadScripts();
}

async function loadScripts() {

    const response =
        await fetch("/api/scripts");

    const data =
        await response.json();

    const container =
        document.getElementById("scripts");

    container.innerHTML = "";

    for (const script of data.scripts) {

        const box =
            document.createElement("div");

        box.className = "script";

        const title =
            document.createElement("b");

        title.textContent =
            script.name;

        const id =
            document.createElement("div");

        id.textContent =
            "ID: " + script.id;

        /*
         * Endpoint của source.
         */
        const url =
            location.origin +
            "/api/" +
            script.id;

        /*
         * Loader template chỉ được
         * hiển thị/copy như text.
         */
        const loader =
            `GET ${url}`;

        const field =
            document.createElement("input");

        field.className = "loader";
        field.value = loader;
        field.readOnly = true;

        const copy =
            document.createElement("button");

        copy.textContent =
            "Copy Loader";

        copy.onclick = async () => {

            await navigator.clipboard
                .writeText(loader);

            copy.textContent =
                "Copied!";

            setTimeout(() => {
                copy.textContent =
                    "Copy Loader";
            }, 1000);
        };

        box.appendChild(title);
        box.appendChild(
            document.createElement("br")
        );
        box.appendChild(id);
        box.appendChild(field);
        box.appendChild(copy);

        container.appendChild(box);
    }

    if (!data.scripts.length) {
        container.textContent =
            "No scripts.";
    }
}

loadScripts();

</script>

</body>
</html>
