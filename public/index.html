<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LEXINX Protect</title>

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: #fff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .hidden {
            display: none !important;
        }

        .center {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 28px;
            box-shadow:
                0 20px 70px
                rgba(0, 0, 0, .55);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin: 7px 0 25px;
        }

        input,
        textarea {
            width: 100%;
            background: #080808;
            color: #fff;
            border: 1px solid #292929;
            border-radius: 10px;
            outline: none;
            padding: 12px;
            margin-bottom: 12px;
        }

        input:focus,
        textarea:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: #fff;
            color: #000;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        button.secondary {
            background: #191919;
            color: #fff;
            border: 1px solid #303030;
        }

        .switch {
            text-align: center;
            margin-top: 18px;
            color: #777;
            cursor: pointer;
        }

        .switch span {
            color: #fff;
            font-weight: 700;
        }

        .message {
            min-height: 20px;
            text-align: center;
            margin-top: 12px;
            color: #ff6666;
        }

        .turnstile {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            min-height: 65px;
        }

        /* DASHBOARD */

        .dashboard {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .brand {
            font-size: 25px;
            font-weight: 900;
        }

        .account {
            color: #888;
            margin-top: 4px;
        }

        .logout {
            width: auto;
            margin: 0;
            padding: 9px 16px;
            background: #191919;
            color: #fff;
            border: 1px solid #333;
        }

        .grid {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 20px;
        }

        .panel h2 {
            margin-top: 0;
        }

        textarea {
            min-height: 350px;
            resize: vertical;
            font-family: monospace;
        }

        .scripts {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .script {
            background: #080808;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 13px;
        }

        .script-name {
            font-weight: 800;
            margin-bottom: 6px;
        }

        .script-id {
            color: #666;
            font-size: 12px;
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .actions button {
            margin: 0;
            padding: 8px;
        }

        .delete {
            background: #301414 !important;
            color: #ff7777 !important;
            border: 1px solid #552020 !important;
        }

        .empty {
            color: #666;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- ==================================================
     AUTH PAGE
================================================== -->

<div
    id="authPage"
    class="center"
>

    <div class="card">

        <div class="logo">
            LEXINX
        </div>

        <div class="subtitle">
            Protect Dashboard
        </div>

        <!-- LOGIN -->

        <div id="loginBox">

            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <div
                class="turnstile"
                id="loginTurnstile"
            ></div>

            <button
                onclick="login()"
            >
                Đăng nhập
            </button>

            <div
                id="loginMessage"
                class="message"
            ></div>

            <div
                class="switch"
                onclick="showRegister()"
            >
                Chưa có tài khoản?
                <span>Đăng ký</span>
            </div>

        </div>

        <!-- REGISTER -->

        <div
            id="registerBox"
            class="hidden"
        >

            <input
                id="registerUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <input
                id="registerPassword2"
                type="password"
                placeholder="Nhập lại password"
                autocomplete="new-password"
            >

            <div
                class="turnstile"
                id="registerTurnstile"
            ></div>

            <button
                onclick="register()"
            >
                Tạo tài khoản
            </button>

            <div
                id="registerMessage"
                class="message"
            ></div>

            <div
                class="switch"
                onclick="showLogin()"
            >
                Đã có tài khoản?
                <span>Đăng nhập</span>
            </div>

        </div>

    </div>

</div>

<!-- ==================================================
     DASHBOARD
================================================== -->

<div
    id="dashboardPage"
    class="dashboard hidden"
>

    <div class="topbar">

        <div>
            <div class="brand">
                LEXINX Protect
            </div>

            <div class="account">
                Account:
                <strong id="accountName">
                    -
                </strong>
            </div>
        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Đăng xuất
        </button>

    </div>

    <div class="grid">

        <!-- EDITOR -->

        <div class="panel">

            <h2 id="editorTitle">
                Tạo Script
            </h2>

            <input
                id="scriptName"
                type="text"
                placeholder="Tên script"
            >

            <textarea
                id="scriptSource"
                placeholder="Nhập source của script..."
            ></textarea>

            <button
                onclick="saveScript()"
            >
                Lưu Script
            </button>

            <button
                class="secondary"
                onclick="clearEditor()"
            >
                Clear
            </button>

            <div
                id="editorMessage"
                class="message"
            ></div>

        </div>

        <!-- SCRIPT LIST -->

        <div class="panel">

            <h2>
                Script của tôi
            </h2>

            <div
                id="scripts"
                class="scripts"
            >
                <div class="empty">
                    Đang tải...
                </div>
            </div>

        </div>

    </div>

</div>

<script>
    /*
     * Thay bằng Site Key thật của
     * Cloudflare Turnstile.
     *
     * Site Key KHÔNG phải Secret Key.
     */
    const TURNSTILE_SITE_KEY =
        "YOUR_TURNSTILE_SITE_KEY";

    let loginWidget = null;
    let registerWidget = null;
    let editingID = null;

    /* =================================================
       TURNSTILE
    ================================================= */

    function renderTurnstile() {

        if (
            !window.turnstile
        ) {
            setTimeout(
                renderTurnstile,
                300
            );

            return;
        }

        if (
            TURNSTILE_SITE_KEY ===
            "YOUR_TURNSTILE_SITE_KEY"
        ) {
            console.warn(
                "Bạn chưa thay TURNSTILE_SITE_KEY"
            );

            return;
        }

        if (
            !loginWidget
        ) {
            loginWidget =
                turnstile.render(
                    "#loginTurnstile",
                    {
                        sitekey:
                            TURNSTILE_SITE_KEY,

                        theme:
                            "dark"
                    }
                );
        }

        if (
            !registerWidget
        ) {
            registerWidget =
                turnstile.render(
                    "#registerTurnstile",
                    {
                        sitekey:
                            TURNSTILE_SITE_KEY,

                        theme:
                            "dark"
                    }
                );
        }
    }

    function getTurnstileToken(
        widget
    ) {
        if (
            widget === null
        ) {
            return "";
        }

        try {
            return turnstile.getResponse(
                widget
            );
        } catch {
            return "";
        }
    }

    function resetTurnstile(
        widget
    ) {
        try {
            if (
                widget !== null
            ) {
                turnstile.reset(
                    widget
                );
            }
        } catch {}
    }

    /* =================================================
       API
    ================================================= */

    async function api(
        url,
        options = {}
    ) {

        const response =
            await fetch(
                url,
                {
                    credentials:
                        "same-origin",

                    ...options,

                    headers: {
                        "Content-Type":
                            "application/json",

                        ...(options.headers ||
                            {})
                    }
                }
            );

        let data = {};

        try {
            data =
                await response.json();
        } catch {}

        if (
            !response.ok
        ) {
            throw new Error(
                data.error ||
                "Request failed"
            );
        }

        return data;
    }

    /* =================================================
       AUTH UI
    ================================================= */

    function showRegister() {

        document
            .getElementById(
                "loginBox"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "registerBox"
            )
            .classList
            .remove("hidden");

        setTimeout(
            renderTurnstile,
            100
        );
    }

    function showLogin() {

        document
            .getElementById(
                "registerBox"
            )
            .classList
            .add("hidden");

        document
            .getElementById(
                "loginBox"
            )
            .classList
            .remove("hidden");

        setTimeout(
            renderTurnstile,
            100
        );
    }

    /* =================================================
       REGISTER
    ================================================= */

    async function register() {

        const username =
            document
                .getElementById(
                    "registerUsername"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;

        const password2 =
            document
                .getElementById(
                    "registerPassword2"
                )
                .value;

        const message =
            document
                .getElementById(
                    "registerMessage"
                );

        message.textContent =
            "";

        if (
            password !==
            password2
        ) {
            message.textContent =
                "Password không giống nhau";

            return;
        }

        const token =
            getTurnstileToken(
                registerWidget
            );

        if (!token) {
            message.textContent =
                "Hãy hoàn thành Cloudflare verification";

            return;
        }

        try {

            const data =
                await api(
                    "/api/register",
                    {
                        method:
                            "POST",

                        body:
                            JSON.stringify({
                                username,
                                password,
                                turnstileToken:
                                    token
                            })
                    }
                );

            /*
             * Server tự cấp URL
             * riêng cho tài khoản.
             */
            window.location.href =
                data.url;

        } catch (error) {

            message.textContent =
                error.message;

            resetTurnstile(
                registerWidget
            );
        }
    }

    /* =================================================
       LOGIN
    ================================================= */

    async function login() {

        const username =
            document
                .getElementById(
                    "loginUsername"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;

        const message =
            document
                .getElementById(
                    "loginMessage"
                );

        message.textContent =
            "";

        const token =
            getTurnstileToken(
                loginWidget
            );

        if (!token) {
            message.textContent =
                "Hãy hoàn thành Cloudflare verification";

            return;
        }

        try {

            const data =
                await api(
                    "/api/login",
                    {
                        method:
                            "POST",

                        body:
                            JSON.stringify({
                                username,
                                password,
                                turnstileToken:
                                    token
                            })
                    }
                );

            /*
             * Không tự ghép URL.
             * Server trả URL đã xác thực.
             */
            window.location.href =
                data.url;

        } catch (error) {

            message.textContent =
                error.message;

            resetTurnstile(
                loginWidget
            );
        }
    }

    /* =================================================
       LOGOUT
    ================================================= */

    async function logout() {

        try {

            await api(
                "/api/logout",
                {
                    method:
                        "POST"
                }
            );

        } catch {}

        window.location.href =
            "/";
    }

    /* =================================================
       ACCOUNT
    ================================================= */

    async function loadAccount() {

        try {

            const data =
                await api(
                    "/api/me"
                );

            document
                .getElementById(
                    "accountName"
                )
                .textContent =
                    data.username;

            document
                .getElementById(
                    "authPage"
                )
                .classList
                .add("hidden");

            document
                .getElementById(
                    "dashboardPage"
                )
                .classList
                .remove("hidden");

            loadScripts();

        } catch {
            /*
             * Không có session:
             * giữ trang login.
             */
        }
    }

    /* =================================================
       SCRIPTS
    ================================================= */

    async function loadScripts() {

        const box =
            document
                .getElementById(
                    "scripts"
                );

        try {

            const data =
                await api(
                    "/api/scripts"
                );

            if (
                !data.scripts ||
                !data.scripts.length
            ) {
                box.innerHTML =
                    `<div class="empty">
                        Chưa có script
                    </div>`;

                return;
            }

            box.innerHTML =
                data.scripts
                    .map(
                        script => `
                        <div class="script">

                            <div class="script-name">
                                ${escapeHTML(
                                    script.name
                                )}
                            </div>

                            <div class="script-id">
                                ID:
                                ${escapeHTML(
                                    script.id
                                )}
                            </div>

                            <div class="actions">

                                <button
                                    onclick="editScript('${script.id}')"
                                >
                                    Edit
                                </button>

                                <button
                                    class="delete"
                                    onclick="deleteScript('${script.id}')"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>
                        `
                    )
                    .join("");

        } catch (error) {

            box.innerHTML =
                `<div class="message">
                    ${escapeHTML(
                        error.message
                    )}
                </div>`;
        }
    }

    /* =================================================
       CREATE / EDIT
    ================================================= */

    async function saveScript() {

        const name =
            document
                .getElementById(
                    "scriptName"
                )
                .value
                .trim();

        const source =
            document
                .getElementById(
                    "scriptSource"
                )
                .value;

        const message =
            document
                .getElementById(
                    "editorMessage"
                );

        message.textContent =
            "";

        try {

            if (
                editingID
            ) {

                await api(
                    "/api/edit/" +
                    editingID,
                    {
                        method:
                            "POST",

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );

                message.textContent =
                    "Đã cập nhật.";

            } else {

                await api(
                    "/api/create",
                    {
                        method:
                            "POST",

                        body:
                            JSON.stringify({
                                name,
                                source
                            })
                    }
                );

                message.textContent =
                    "Đã tạo script.";
            }

            clearEditor();
            loadScripts();

        } catch (error) {

            message.textContent =
                error.message;
        }
    }

    /* =================================================
       EDIT
    ================================================= */

    async function editScript(id) {

        try {

            const data =
                await api(
                    "/api/script/" +
                    id
                );

            editingID =
                id;

            document
                .getElementById(
                    "editorTitle"
                )
                .textContent =
                    "Edit Script";

            document
                .getElementById(
                    "scriptName"
                )
                .value =
                    data.script.name;

            document
                .getElementById(
                    "scriptSource"
                )
                .value =
                    data.script.source;

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    /* =================================================
       DELETE
    ================================================= */

    async function deleteScript(
        id
    ) {

        if (
            !confirm(
                "Bạn có chắc muốn xóa script này?"
            )
        ) {
            return;
        }

        try {

            await api(
                "/api/delete/" +
                id,
                {
                    method:
                        "DELETE"
                }
            );

            loadScripts();

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    /* =================================================
       CLEAR
    ================================================= */

    function clearEditor() {

        editingID =
            null;

        document
            .getElementById(
                "editorTitle"
            )
            .textContent =
                "Tạo Script";

        document
            .getElementById(
                "scriptName"
            )
            .value =
                "";

        document
            .getElementById(
                "scriptSource"
            )
            .value =
                "";
    }

    /* =================================================
       ESCAPE
    ================================================= */

    function escapeHTML(
        value
    ) {
        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

    /* =================================================
       START
    ================================================= */

    renderTurnstile();
    loadAccount();
</script>

</body>
</html>
