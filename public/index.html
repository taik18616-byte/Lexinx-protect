<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: min(950px, 94%);
    margin: 35px auto;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
}

h1 {
    margin-top: 0;
}

input,
textarea {
    width: 100%;
    background: #070707;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin-top: 8px;
}

textarea {
    height: 300px;
    resize: vertical;
    font-family: monospace;
}

button {
    background: #fff;
    color: #000;
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    margin-top: 10px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: .85;
}

.script {
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
}

.loader {
    font-family: monospace;
}

.small {
    color: #888;
    font-size: 13px;
}

.success {
    color: #55ff88;
}

.error {
    color: #ff5555;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>LEXINX PROTECT</h1>

<p class="small">
Lua Source Protection / Loader Generator
</p>

<input
    id="name"
    placeholder="Script name"
>

<input
    id="file"
    type="file"
    accept=".lua,.txt"
>

<textarea
    id="source"
    placeholder="Paste your Lua source here..."
></textarea>

<button onclick="createScript()">
    Create Loader
</button>

<p id="status"></p>

</div>

<div class="card">

<h2>Your Scripts</h2>

<div id="scripts">
    Loading...
</div>

</div>

</div>

<script>

async function createScript() {

    const status =
        document.getElementById("status");

    const name =
        document.getElementById("name")
            .value;

    const file =
        document.getElementById("file")
            .files[0];

    let source =
        document.getElementById("source")
            .value;

    /*
        Nếu upload file thì lấy
        nội dung file.
    */

    if (file) {
        source = await file.text();
    }

    if (!source.trim()) {

        status.className = "error";

        status.textContent =
            "Script is empty.";

        return;
    }

    status.className = "";
    status.textContent =
        "Creating...";

    try {

        const response =
            await fetch("/api/create", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name:
                        name ||
                        file?.name ||
                        "Script",

                    source
                })
            });

        const data =
            await response.json();

        if (!data.ok) {
            throw new Error(
                data.error ||
                "Create failed"
            );
        }

        status.className =
            "success";

        status.textContent =
            "Created: " + data.id;

        document
            .getElementById("source")
            .value = "";

        document
            .getElementById("file")
            .value = "";

        loadScripts();

    } catch (err) {

        status.className =
            "error";

        status.textContent =
            err.message;
    }
}

async function copyText(text, button) {

    try {

        await navigator
            .clipboard
            .writeText(text);

    } catch {

        const area =
            document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();
    }

    const old =
        button.textContent;

    button.textContent =
        "Copied!";

    setTimeout(() => {
        button.textContent = old;
    }, 1000);
}

async function loadScripts() {

    const container =
        document.getElementById("scripts");

    try {

        const response =
            await fetch(
                "/api/scripts"
            );

        const data =
            await response.json();

        container.innerHTML = "";

        if (!data.scripts.length) {

            container.innerHTML =
                "<p class='small'>No scripts yet.</p>";

            return;
        }

        for (const script of data.scripts) {

            const box =
                document.createElement("div");

            box.className =
                "script";

            const title =
                document.createElement("h3");

            title.textContent =
                script.name;

            const id =
                document.createElement("p");

            id.className =
                "small";

            id.textContent =
                "ID: " + script.id;

            const loader =
                document.createElement("input");

            loader.className =
                "loader";

            loader.readOnly = true;

            loader.value =
                script.loader;

            const copy =
                document.createElement("button");

            copy.textContent =
                "Copy Full Loader";

            copy.onclick = () => {

                copyText(
                    script.loader,
                    copy
                );
            };

            const endpoint =
                document.createElement("button");

            endpoint.textContent =
                "Copy API URL";

            endpoint.onclick = () => {

                copyText(
                    script.endpoint,
                    endpoint
                );
            };

            box.appendChild(title);
            box.appendChild(id);
            box.appendChild(loader);
            box.appendChild(copy);
            box.appendChild(endpoint);

            container.appendChild(box);
        }

    } catch (err) {

        container.textContent =
            "Failed to load scripts.";
    }
}

loadScripts();

</script>

</body>

    </html>
