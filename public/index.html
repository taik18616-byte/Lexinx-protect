<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LEXINX Protect</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #09090c;

    color: #eeeeee;

    font-family:
        Arial,
        sans-serif;
}

.container {

    width: 100%;

    max-width: 1000px;

    margin: auto;

    padding: 25px;
}

h1 {

    margin-bottom: 5px;
}

.subtitle {

    color: #888;

    margin-bottom: 25px;
}

.panel {

    background: #15151c;

    border:
        1px solid
        #292934;

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 20px;
}

input,
textarea {

    width: 100%;

    background: #0c0c11;

    color: white;

    border:
        1px solid
        #33333f;

    border-radius: 8px;

    padding: 12px;

    margin-top: 8px;

    margin-bottom: 15px;

    outline: none;
}

textarea {

    min-height: 220px;

    resize: vertical;

    font-family: monospace;
}

button {

    border: 0;

    border-radius: 7px;

    padding:
        10px 15px;

    cursor: pointer;

    background: #292936;

    color: white;

    margin:
        4px;
}

button:hover {

    background: #3a3a4a;
}

.primary {

    background: #5865f2;
}

.success {

    background: #287a4d;
}

.danger {

    background: #b83232;
}

.script {

    border:
        1px solid
        #30303b;

    border-radius: 10px;

    padding: 15px;

    margin-top: 12px;
}

.script-name {

    font-size: 18px;

    font-weight: bold;
}

.id {

    color: #888;

    margin:
        6px 0;
}

.loader {

    background: #08080b;

    padding: 10px;

    border-radius: 7px;

    font-family: monospace;

    word-break: break-all;

    margin:
        10px 0;
}

.active {

    color: #4ed68a;
}

.revoked {

    color: #e85b5b;
}

</style>

</head>


<body>

<div class="container">

<h1>
LEXINX Protect
</h1>

<div class="subtitle">
Lua Script Loader Manager
</div>


<div class="panel">

<h2>
Create Loader
</h2>


<label>
Script name
</label>

<input
    id="name"
    placeholder="My Script"
>


<label>
Lua payload
</label>

<textarea
    id="payload"
    placeholder='print("67")'
></textarea>


<button
    class="primary"
    onclick="createScript()"
>
Create Loader
</button>

</div>


<div class="panel">

<h2>
Script List
</h2>

<div id="scripts">
Loading...
</div>

</div>

</div>


<script>


// ==================================================
// CREATE
// ==================================================

async function createScript() {

    const name =
        document.getElementById(
            "name"
        ).value;

    const payload =
        document.getElementById(
            "payload"
        ).value;


    if (!name.trim()) {

        alert(
            "Enter script name"
        );

        return;
    }


    if (!payload.trim()) {

        alert(
            "Enter Lua payload"
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/admin/create",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name,
                            payload
                        })
                }
            );


        const data =
            await response.json();


        if (!data.ok) {

            alert(
                data.error ||
                "Create failed"
            );

            return;
        }


        await navigator
            .clipboard
            .writeText(
                data.script.loader
            );


        alert(
            "Loader created!\n\n" +
            data.script.loader +
            "\n\nCopied."
        );


        document
            .getElementById("name")
            .value = "";


        document
            .getElementById("payload")
            .value = "";


        loadScripts();

    } catch (error) {

        alert(
            "Network error: " +
            error
        );
    }
}


// ==================================================
// LIST
// ==================================================

async function loadScripts() {

    const container =
        document.getElementById(
            "scripts"
        );


    try {

        const response =
            await fetch(
                "/admin/list"
            );


        const data =
            await response.json();


        if (!data.ok) {

            container.innerHTML =
                "Failed to load.";

            return;
        }


        container.innerHTML = "";


        if (
            data.scripts.length === 0
        ) {

            container.innerHTML =
                "No scripts.";

            return;
        }


        for (
            const script
            of data.scripts
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "script";


            const name =
                escapeHTML(
                    script.name
                );


            const id =
                escapeHTML(
                    script.id
                );


            const loader =
                escapeHTML(
                    script.loader
                );


            div.innerHTML = `

                <div class="script-name">
                    ${name}
                </div>

                <div class="id">
                    ID: ${id}
                </div>

                <div class="${
                    script.active
                        ? "active"
                        : "revoked"
                }">

                    ${
                        script.active
                            ? "ACTIVE"
                            : "REVOKED"
                    }

                </div>

                <div class="loader">
                    ${loader}
                </div>

                <button
                    class="success"
                    onclick="copyLoader(
                        ${JSON.stringify(
                            script.loader
                        )}
                    )"
                >
                    Copy Loader
                </button>

                ${
                    script.active

                    ?

                    `<button
                        class="danger"
                        onclick="revokeScript(
                            '${id}'
                        )"
                    >
                        Revoke
                    </button>`

                    :

                    `<button
                        class="primary"
                        onclick="enableScript(
                            '${id}'
                        )"
                    >
                        Enable
                    </button>`
                }

                <button
                    onclick="deleteScript(
                        '${id}'
                    )"
                >
                    Delete
                </button>
            `;


            container.appendChild(
                div
            );
        }

    } catch (error) {

        container.innerHTML =
            "Network error.";
    }
}


// ==================================================
// COPY
// ==================================================

async function copyLoader(
    loader
) {

    try {

        await navigator
            .clipboard
            .writeText(loader);

        alert(
            "Loader copied!"
        );

    } catch {

        alert(
            "Copy failed"
        );
    }
}


// ==================================================
// REVOKE
// ==================================================

async function revokeScript(
    id
) {

    if (
        !confirm(
            "Revoke this script?"
        )
    ) {
        return;
    }


    await fetch(
        "/admin/revoke/" +
        encodeURIComponent(id),
        {
            method: "POST"
        }
    );


    loadScripts();
}


// ==================================================
// ENABLE
// ==================================================

async function enableScript(
    id
) {

    await fetch(
        "/admin/enable/" +
        encodeURIComponent(id),
        {
            method: "POST"
        }
    );


    loadScripts();
}


// ==================================================
// DELETE
// ==================================================

async function deleteScript(
    id
) {

    if (
        !confirm(
            "Delete permanently?"
        )
    ) {
        return;
    }


    await fetch(
        "/admin/delete/" +
        encodeURIComponent(id),
        {
            method: "DELETE"
        }
    );


    loadScripts();
}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


// ==================================================
// INITIAL LOAD
// ==================================================

loadScripts();

</script>

</body>

    </html>
