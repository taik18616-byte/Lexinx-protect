<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>LEXINX PROTECT</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: Arial, sans-serif;
}

.container {
    width: min(1000px, 94%);
    margin: 35px auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    letter-spacing: 5px;
    margin-bottom: 8px;
}

.header p {
    color: #777;
}

.card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 20px;
}

input,
textarea {
    width: 100%;
    background: #050505;
    border: 1px solid #333;
    border-radius: 9px;
    color: #ddd;
    padding: 12px;
}

input {
    margin-bottom: 12px;
}

textarea {
    min-height: 320px;
    resize: vertical;
    font-family: monospace;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 15px;
    cursor: pointer;
    font-weight: bold;
}

.create {
    margin-top: 12px;
}

.script {
    border: 1px solid #292929;
    background: #080808;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
}

.script-name {
    font-weight: bold;
    font-size: 17px;
}

.script-id {
    color: #666;
    font: 11px monospace;
    margin-top: 5px;
}

.loader-title {
    color: #777;
    font-size: 12px;
    margin-top: 15px;
}

.loader-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
}

.loader {
    flex: 1;
    min-width: 0;
    background: #000;
    color: #aaa;
    font: 12px monospace;
}

.copy {
    white-space: nowrap;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.delete {
    background: #242424;
    color: white;
}

.status {
    color: #777;
    margin-top: 10px;
    font-family: monospace;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>LEXINX PROTECT</h1>

<p>
Lua Protection & Loader Generator
</p>

</div>

<div class="card">

<h2>Protect Script</h2>

<input
    id="name"
    placeholder="Script name"
>

<input
    id="file"
    type="file"
    accept=".lua,.txt"
>

<textarea
    id="code"
    placeholder="Paste your Lua source here..."
></textarea>

<button
    class="create"
    onclick="createScript()"
>
Create Protected Loader
</button>

<div
    class="status"
    id="status"
></div>

</div>

<div class="card">

<h2>Your Scripts</h2>

<div id="scripts">
Loading...
</div>

</div>

</div>

<script>

async function createScript() {

    const status =
        document.getElementById(
            "status"
        );

    const name =
        document.getElementById(
            "name"
        ).value ||
        "Script";

    const file =
        document.getElementById(
            "file"
        ).files[0];

    let code =
        document.getElementById(
            "code"
        ).value;

    try {

        if (file) {
            code =
                await file.text();
        }

        if (!code.trim()) {
            throw new Error(
                "Script is empty"
            );
        }

        status.textContent =
            "Protecting...";

        const response =
            await fetch(
                "/api/create",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            name,
                            code
                        })
                }
            );

        const data =
            await response.json();

        if (!data.ok) {
            throw new Error(
                data.error ||
                "Failed"
            );
        }

        status.textContent =
            "Created: " +
            data.id;

        document.getElementById(
            "code"
        ).value = "";

        document.getElementById(
            "file"
        ).value = "";

        loadScripts();

    } catch (e) {

        status.textContent =
            "ERROR: " +
            e.message;
    }
}

async function loadScripts() {

    const box =
        document.getElementById(
            "scripts"
        );

    try {

        const response =
            await fetch(
                "/api/scripts",
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        box.innerHTML = "";

        if (
            !data.scripts.length
        ) {

            box.innerHTML =
                `<div style="color:#666">
                    No protected scripts.
                </div>`;

            return;
        }

        for (
            const script
            of data.scripts
        ) {

            const loader =
                `loadstring(game:HttpGet("${location.origin}/api/${script.id}"))()`;

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "script";

            item.innerHTML = `
                <div class="script-name">
                    ${escapeHTML(script.name)}
                </div>

                <div class="script-id">
                    ID: ${escapeHTML(script.id)}
                </div>

                <div class="loader-title">
                    FULL LOADER
                </div>

                <div class="loader-row">

                    <input
                        class="loader"
                        readonly
                        value="${escapeHTML(loader)}"
                    >

                    <button class="copy">
                        Copy Full Loader
                    </button>

                </div>

                <div class="actions">

                    <button class="delete">
                        Delete
                    </button>

                </div>
            `;

            const copy =
                item.querySelector(
                    ".copy"
                );

            copy.onclick =
                async () => {

                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                loader
                            );

                    } catch {

                        const input =
                            item.querySelector(
                                ".loader"
                            );

                        input.select();

                        document.execCommand(
                            "copy"
                        );
                    }

                    copy.textContent =
                        "Copied!";

                    setTimeout(
                        () => {
                            copy.textContent =
                                "Copy Full Loader";
                        },
                        1500
                    );
                };

            const del =
                item.querySelector(
                    ".delete"
                );

            del.onclick =
                async () => {

                    if (
                        !confirm(
                            "Delete this script?"
                        )
                    ) {
                        return;
                    }

                    await fetch(
                        `/api/scripts/${encodeURIComponent(script.id)}`,
                        {
                            method:
                                "DELETE"
                        }
                    );

                    loadScripts();
                };

            box.appendChild(item);
        }

    } catch {

        box.textContent =
            "Failed to load scripts.";
    }
}

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

loadScripts();

</script>

</body>

</html>
